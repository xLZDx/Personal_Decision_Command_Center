name: Governance

# Manifest integrity + gate scope, in ONE job, in this order:
#
#     resolve gate  ->  verify manifest hash  ->  verify changed paths
#
# The ordering is the whole point and is why these are not two workflows. Validating a diff
# against a manifest whose integrity has not been established first is circular: the same diff
# could have rewritten the manifest that authorizes it. That circularity is NM3 from the v0.2
# adversarial review, and splitting the checks into two workflows with `needs: []` quietly
# reintroduced it while the design document still claimed the ordering held -- GPT-PM caught that
# as G1-M2. Sequential steps in one job make the scope check unreachable unless the hash matched.
#
# The scope check runs `node` against repository sources only -- no `npm ci`, no dependencies. A
# PR cannot disable this check by breaking the dependency tree.
#
# HONEST LIMITATION: this is a `pull_request` workflow, so it does not run on a direct push to
# `main`. Scope enforcement exists on the PR path only. See governance/GATE_MANIFEST_INTEGRITY.md
# for the full list of what this does and does not protect against -- notably that a PR editing
# `.github/**` edits the checks that police it, which is why `.github/**` is CODEOWNERS-listed.
# CODEOWNERS review is NOT currently a required status check on `main` (core/RISK_REGISTER.md R13:
# `require_code_owner_review` is measured `false`), so today that listing documents intended
# ownership rather than mechanically enforcing anything -- separation here is procedural, resting
# on the implementer's compliance and the audit trail in DECISION_LOG.md, not on a platform control.
#
# REMOVED: an "UNGATED PATH" ("Gate: NONE") used to exist here, checked against a permissive floor
# (check-floor-scope.mjs) instead of a per-gate manifest. It was removed as a closure finding on
# this gate: the floor's own enforcement code lived under scripts/verify/**, which is PR-checkout
# content, and its FORBIDDEN_PATHS list did not include that directory -- so a "Gate: NONE" PR could
# edit the very script that was supposed to constrain it, and CI would run the EDITED version from
# that PR's own checkout and see nothing wrong. Widening FORBIDDEN_PATHS would only have moved the
# same self-modification problem, not closed it: whatever list the floor checks against is still
# code inside the PR being checked. There is no ungated path anymore -- every PR must resolve to a
# real, adopted gate (a `gate/g<N>-...` branch or a `Gate: G<N>` body line) or the workflow fails at
# gate resolution below, before any PR-controlled scope code ever executes.
#
# TWO ADDITIONS BELOW, from the second fresh-context closure review (2026-09-12), both closing
# gaps a resolved gate's own manifest still had:
#
# GATE_ACTIVE (BLOCKER): removing "Gate: NONE" closed the self-modification hole, but resolving a
# gate purely from the PR-controlled branch name/body still meant ANY adopted gate's manifest/hash
# stays trusted forever, even after that gate is done and should be retired -- a PR could always
# relabel itself `Gate: G1` and ride G1's broad approved scope. The operator-controlled
# GATE_ACTIVE variable names the one gate currently authorized; a PR declaring any other gate is
# refused regardless of that other gate's manifest/hash still validating.
#
# manifest-proposal/g<N> and manifest-amendment/g<N> (BLOCKER): once main is ruleset-protected (no
# bypass actors), there was no PR path left to ever introduce a NEW gate's manifest, or revise an
# already-adopted one -- a PR labeled for the current gate hits that gate's own forbidden_paths on
# any governance/gate-manifests/** touch, and a PR labeled for a future gate fails at the ordinary
# hash step (no manifest/hash exists yet). Both branch names are validated by the SAME check,
# reusing the pre-approved-hash-then-verify-equality model the ordinary hash step below already
# uses -- corrected from this fix's first version, which wrongly treated an absent hash as
# sufficient by itself; GPT-PM's round-1 review of that version caught it as still a BLOCKER. See
# scripts/verify/check-manifest-proposal.mjs.

on:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for a manifest-proposal/amendment PR
        id: proposal
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # A branch named exactly manifest-proposal/g<N> or manifest-amendment/g<N> is validated
          # entirely by the next step, never by ordinary gate resolution -- see
          # check-manifest-proposal.mjs and this file's header. Any other branch name is unaffected;
          # this step only classifies.
          if [[ "$BRANCH" =~ ^manifest-(proposal|amendment)/[gG][0-9]+$ ]]; then
            echo "is_proposal=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_proposal=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the manifest-proposal/amendment PR
        if: steps.proposal.outputs.is_proposal == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: node scripts/verify/check-manifest-proposal.mjs

      - name: Resolve the gate this PR belongs to
        id: gate
        if: steps.proposal.outputs.is_proposal != 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GATE_ACTIVE: ${{ vars.GATE_ACTIVE }}
        run: |
          set -euo pipefail
          # Branch `gate/g1-something` -> G1; or a `Gate: G1` line in the PR body. There is no
          # ungated declaration anymore (see this file's header) -- every PR must resolve to a
          # real, adopted gate or this step fails before anything else runs.
          gate=""
          if [[ "$BRANCH" =~ ^gate/([gG][0-9]+) ]]; then
            gate="${BASH_REMATCH[1]}"
            gate="${gate^^}"
          elif [[ "$PR_BODY" =~ [Gg]ate:[[:space:]]*([gG][0-9]+) ]]; then
            gate="${BASH_REMATCH[1]}"
            gate="${gate^^}"
          fi
          if [[ -z "$gate" ]]; then
            echo "::error::This PR declares no gate. Name the branch gate/g<N>-... or put a"
            echo "::error::'Gate: G<N>' line in the PR body. A change with no declaration has no"
            echo "::error::approved scope, which is the thing this check exists to require."
            exit 1
          fi

          # GATE_ACTIVE binds resolution to operator-controlled lifecycle state (closure-review
          # BLOCKER 1): a PR-declared gate label is otherwise pure implementer-controlled text, so
          # a retired gate's still-valid manifest/hash could be ridden by simply relabeling a PR.
          if [[ -z "$GATE_ACTIVE" ]]; then
            echo "::error::GATE_ACTIVE is not set. The operator must set this repository variable"
            echo "::error::to the currently authorized gate label (e.g. G1) before any PR-declared"
            echo "::error::gate can be trusted -- a declared gate with no operator-controlled"
            echo "::error::active-gate binding has no enforced scope, regardless of that gate's"
            echo "::error::own manifest/hash still existing."
            exit 1
          fi
          if [[ "$gate" != "${GATE_ACTIVE^^}" ]]; then
            echo "::error::This PR declares Gate: $gate, but the operator-controlled active gate"
            echo "::error::is $GATE_ACTIVE. A gate that is not the currently active one has no"
            echo "::error::enforced scope regardless of its manifest/hash still existing -- it may"
            echo "::error::have been retired."
            exit 1
          fi

          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Resolved gate: $gate (active: $GATE_ACTIVE)"

      - name: Verify manifest hash against operator-controlled state
        id: manifest
        if: steps.proposal.outputs.is_proposal != 'true'
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          manifest="governance/gate-manifests/${GATE,,}.yaml"
          approved=$(echo "$ALL_VARS" | jq -r --arg k "GATE_MANIFEST_APPROVED_HASH_${GATE}" '.[$k] // ""')

          if [[ ! -f "$manifest" ]]; then
            if [[ -n "$approved" ]]; then
              echo "::error::${GATE} has an approved hash but $manifest is missing -- the manifest"
              echo "::error::was deleted or renamed in this PR."
            else
              echo "::error::No manifest at $manifest and no approved hash for ${GATE}."
              echo "::error::The operator must author and adopt the manifest, and set the repository"
              echo "::error::variable GATE_MANIFEST_APPROVED_HASH_${GATE}, before this gate can merge."
              echo "::error::An implementer-authored manifest has no authority (INV-28)."
            fi
            exit 1
          fi

          actual=$(sha256sum "$manifest" | cut -d' ' -f1)
          echo "manifest: $manifest"
          echo "actual:   $actual"

          if [[ -z "$approved" ]]; then
            echo "::error::Repository variable GATE_MANIFEST_APPROVED_HASH_${GATE} is not set."
            echo "::error::Set it to the hash above ONLY if you (the operator) authored or actually"
            echo "::error::reviewed this manifest. Setting it to whatever CI just printed, without"
            echo "::error::reading the manifest, reduces this control to a rubber stamp."
            exit 1
          fi

          if [[ "$actual" != "$approved" ]]; then
            echo "::error::Manifest hash mismatch for ${GATE}."
            echo "::error::approved: $approved"
            echo "::error::actual:   $actual"
            echo "::error::$manifest differs from what the operator approved. An implementer-branch"
            echo "::error::edit to a manifest has no authority (INV-28)."
            exit 1
          fi

          echo "Manifest hash matches the operator-approved value."
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      # Reachable only when the hash step above exited 0 -- the manifest it verified is passed on
      # unchanged.
      - name: Check changed paths against the verified scope
        if: steps.proposal.outputs.is_proposal != 'true'
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/verify/check-gate-scope.mjs
