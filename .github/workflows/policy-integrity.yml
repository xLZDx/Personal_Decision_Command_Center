name: Policy integrity

# Verifies that the gate manifest authorizing this PR is the one the operator approved -- not one
# the PR itself rewrote. See governance/GATE_MANIFEST_INTEGRITY.md for the full design, including
# an explicit list of what this does NOT protect against.
#
# The approved hash lives in a repository VARIABLE, deliberately not in the git tree: a branch
# cannot alter a repository variable by committing anything.
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   Name:  GATE_MANIFEST_APPROVED_HASH_<GATE>      e.g. GATE_MANIFEST_APPROVED_HASH_G1
#   Value: sha256 of governance/gate-manifests/<gate>.yaml

on:
  pull_request:

permissions:
  contents: read

jobs:
  manifest-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the gate this PR belongs to
        id: gate
        env:
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Branch `gate/g1-something` -> G1; otherwise a `Gate: G1` line in the PR body.
          gate=""
          if [[ "$BRANCH" =~ ^gate/([gG][0-9]+) ]]; then
            gate="${BASH_REMATCH[1]}"
          elif [[ "$PR_BODY" =~ [Gg]ate:[[:space:]]*([gG][0-9]+) ]]; then
            gate="${BASH_REMATCH[1]}"
          fi
          gate="${gate^^}"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Resolved gate: ${gate:-<none>}"

      - name: Verify manifest hash against operator-controlled state
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          APPROVED_HASHES: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          if [[ -z "$GATE" ]]; then
            echo "::error::This PR does not declare a gate. Name the branch gate/g<N>-... or"
            echo "::error::put a 'Gate: G<N>' line in the PR body. A change with no gate has no"
            echo "::error::approved scope, which is the thing this check exists to require."
            exit 1
          fi

          manifest="governance/gate-manifests/${GATE,,}.yaml"
          approved=$(echo "$APPROVED_HASHES" | jq -r --arg k "GATE_MANIFEST_APPROVED_HASH_${GATE}" '.[$k] // ""')

          if [[ ! -f "$manifest" ]]; then
            if [[ -n "$approved" ]]; then
              echo "::error::${GATE} has an approved hash but $manifest is missing -- the manifest"
              echo "::error::was deleted or renamed in this PR."
              exit 1
            fi
            echo "::error::No manifest at $manifest and no approved hash for ${GATE}."
            echo "::error::The operator must author and adopt the manifest, and set the repository"
            echo "::error::variable GATE_MANIFEST_APPROVED_HASH_${GATE}, before this gate can merge."
            echo "::error::An implementer-authored manifest has no authority (INV-28)."
            exit 1
          fi

          actual=$(sha256sum "$manifest" | cut -d' ' -f1)
          echo "manifest: $manifest"
          echo "actual:   $actual"

          if [[ -z "$approved" ]]; then
            echo "::error::Repository variable GATE_MANIFEST_APPROVED_HASH_${GATE} is not set."
            echo "::error::Set it to the hash above ONLY if you (the operator) authored/reviewed"
            echo "::error::this manifest. Setting it to whatever CI just printed, without reading"
            echo "::error::the manifest, reduces this control to a rubber stamp."
            exit 1
          fi

          if [[ "$actual" != "$approved" ]]; then
            echo "::error::Manifest hash mismatch for ${GATE}."
            echo "::error::approved: $approved"
            echo "::error::actual:   $actual"
            echo "::error::$manifest was modified relative to what the operator approved. An"
            echo "::error::implementer-branch edit to a manifest has no authority (INV-28)."
            exit 1
          fi

          echo "Manifest hash matches the operator-approved value."
