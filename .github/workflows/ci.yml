name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test-deletion guard needs the base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run --coverage

      # A suite that reports success while running zero tests is the failure mode that would make
      # every check above meaningless. vitest is configured with passWithNoTests:false, and this
      # asserts the count independently rather than trusting that config to stay set.
      - name: Assert the suite actually ran tests
        run: node scripts/verify/assert-tests-ran.mjs

      # TDD.md §57(12) needs coverage/diff CHANGES reported, not only the current run's numbers
      # (GPT-PM's round-1 finding on this remediation: the first version of this reporter only did
      # the latter). Re-running the whole suite against the base commit just to get a comparison
      # number would double CI time for every PR, so instead every commit that lands on `main`
      # caches its own coverage-summary.json keyed by its own SHA; a PR restores whatever is cached
      # under its BASE commit's SHA (best-effort -- absent for the very first run after this
      # shipped, or after a cache eviction, and report-coverage.mjs says so plainly rather than
      # fabricating a delta).
      - name: Restore coverage baseline (base commit, PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ github.event.pull_request.base.sha }}

      - name: Report coverage
        run: node scripts/verify/report-coverage.mjs

      - name: Save coverage baseline for this commit (push to main only)
        if: github.event_name == 'push'
        run: |
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json

      - name: Cache coverage baseline for this commit (push to main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ github.sha }}

      - name: Test-deletion guard
        if: github.event_name == 'pull_request'
        run: node scripts/verify/check-test-deletion.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Secret scan
        run: node scripts/verify/check-secrets.mjs

      - name: Dependency audit
        # Advisory only at G1: `npm audit` fails on transitive advisories with no available fix,
        # which would block unrelated gates. Tightening this to a hard failure needs a decision
        # about which severity blocks -- deferred to G8 (see core/RISK_REGISTER.md).
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings (advisory at G1)"
