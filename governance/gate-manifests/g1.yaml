# OPERATOR-DIRECTED, IMPLEMENTER-AUTHORED G1 MANIFEST CANDIDATE.
#
# This file has no governance authority merely because it exists on main.
# Its scope becomes authoritative only after the operator reviews these exact
# committed bytes and sets GATE_MANIFEST_APPROVED_HASH_G1 to their matching
# SHA-256.
#
# THE CI-REPORTED HASH IS PROVIDED TO AVOID BYTE / LINE-ENDING MISTAKES.
# IT IS NOT A SUBSTITUTE FOR READING THIS MANIFEST.
#
# .github/workflows/governance.yml prints the file's actual sha256 when the
# approval variable is unset, and says in its own error text that setting that
# printed value without reading the manifest reduces the control to a rubber
# stamp. That warning is repeated here because the value is easy to paste and
# the file is long: setting the variable without reading what follows approves
# 24 allowed paths and 4 forbidden paths sight-unseen.
#
# ---------------------------------------------------------------------------
# WHY AN IMPLEMENTER WROTE THE OPERATOR'S DOCUMENT
#
# INV-28 makes gate manifests and their approved hashes operator-owned
# governance state. The authoring half of that was delegated, explicitly and in
# writing, by the operator on 2026-09-11:
#
#   "го создай манифест за меня и всё что ты можешь сделать сам. логины в конце"
#   ("GO, create the manifest for me and everything you can do yourself;
#    logins last")
#
# The approving half was NOT delegated. GPT-PM was asked to rule on whether the
# same delegation extended to setting GATE_MANIFEST_APPROVED_HASH_G1, and ruled
# that it does not:
#
#   "Final authority ruling remains Option A: implementer may author and push
#    the candidate manifest at the operator's explicit direction, but must not
#    set GATE_MANIFEST_APPROVED_HASH_G1. The operator must review the exact
#    committed bytes and set the verified hash only if adopting them."
#
# The reasoning, recorded so it survives outside a chat log: if one party writes
# a manifest AND installs the hash that makes it binding, the check proves
# nothing about scope authority. That closed loop is NM3 from the v0.2
# adversarial review, and G1's whole closure argument rests on NM3 being closed.
#
# READ "operator-controlled" AS GOVERNANCE AUTHORITY, NOT AS TECHNICAL
# EXCLUSIVITY. The authenticated implementation session is technically capable
# of changing that repository variable and the repository's admin settings; the
# separation is therefore procedural until the credential model in limitation 5
# is resolved.
#
#   operator-authorized  !=  technically operator-exclusive
#
# ---------------------------------------------------------------------------
# HISTORY OF THIS DOCUMENT, stated as history and not as a live claim
#
# The scope below was first drafted at governance/plans/G1_MANIFEST_PROPOSAL.yaml
# as an argument for the operator to read, reject, edit or adopt. That draft
# file still exists and still describes itself, correctly, as carrying no
# authority. This file is a separate object: the candidate the operator was
# asked to review, placed where the Governance workflow actually looks for it.
# The two are not interchangeable, and the draft's own instructions about how
# adoption should proceed were written before the operator delegated authoring.
# ---------------------------------------------------------------------------

