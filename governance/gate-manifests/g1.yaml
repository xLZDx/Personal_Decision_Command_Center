# ---------------------------------------------------------------------------
# DELIBERATELY EXCLUDED, and why
#
#   packages/contracts/**    The contracts landed in b784265, which is already
#                            on main and therefore not in this branch's diff.
#                            No remaining G1 action touches them. If closure
#                            turns out to need a contract change, that is a
#                            scope change: it needs a new plan and a new GO, not
#                            a wider manifest. Widening a manifest to fit a diff
#                            is the failure mode this whole mechanism exists to
#                            prevent.
#
#   core/adr/**              The ADRs are adopted. G1 does not amend them.
#
#   docs/product/**,         Not touched by G1 and not required by any remaining
#   docs/runbooks/**         G1 action.
#
#   scripts/probes/**        G0 evidence. G0 is closed.
#
#   .claude/**               Agent configuration, not gate deliverables.
#
#   CONTRIBUTING.md,         Present in the repository, untouched by G1.
#   SECURITY.md,
#   .gitignore,
#   .prettierrc.json,
#   eslint.config.js
#
# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST CANNOT DO, EVEN ONCE ITS HASH IS APPROVED
#
#   1. It cannot tell a tightening of .github/CODEOWNERS from a loosening of
#      it. The scope check sees a changed path, not the direction of the change.
#      Only branch protection requiring code-owner review covers that, and that
#      is R12 -- available now that the repository is public, and not yet
#      applied.
#   2. The `Gate: G1` label that selects this manifest comes from the branch
#      name or the PR body, both written by the implementer. An implementer who
#      chose a different gate's label would be checked against a different
#      manifest (limitation 6 in ../GATE_MANIFEST_INTEGRITY.md).
#   3. Nothing checks plan_hash. governance.yml verifies THIS FILE's own sha256
#      against the operator-held repository variable; it never reads plan_hash
#      and never compares it to the plan file. That is limitation 7 in
#      ../GATE_MANIFEST_INTEGRITY.md, which is why the provenance above is
#      pinned to immutable objects a human can verify by hand.
#   4. The check runs on pull_request only. A direct push to main is not
#      examined by it at all -- including the push that placed this file. That
#      gap is closed by branch protection, not by this file.
#   5. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH. Measured
#      2026-09-10, after the operator authenticated the GitHub CLI on this
#      machine: the credential available to the implementer's session is a
#      classic PAT with `repo`, `workflow` and `admin:org`, and
#      `.permissions.admin` is true on this repository. It can set
#      GATE_MANIFEST_APPROVED_HASH_G1, write a manifest and then set the hash to
#      match it, remove branch protection, and edit the Governance workflow
#      itself. The separation this mechanism describes is therefore PROCEDURAL:
#      it rests on the implementer not doing what it is able to do, not on being
#      unable to. Full measurement, and the three ways to restore the mechanical
#      property, in ../plans/G1_PREADOPTION_EVIDENCE.md section 3.1. Approving
#      this manifest does not fix it; that is a credential decision, and it is
#      the operator's.
#   6. AND THE ONE THIS FILE ADDS BY EXISTING: an implementer wrote it. The
#      scope below was reasoned from the plan, the findings and the measured
#      diff, and it was reviewed by GPT-PM -- but the party bound by this scope
#      is the party that drafted it. The only thing standing between that and a
#      self-authorized scope is the operator actually reading these bytes before
#      setting the hash. That is not a formality; it is the entire remaining
#      control.
#
# ---------------------------------------------------------------------------
# WHAT REMAINS, AND WHOSE ACTION EACH ONE IS
#
#   1. operator   Read this file. In particular the 24 allowed_paths and the 4
#                 forbidden_paths, and limitation 6 above. Narrowing the scope
#                 is always safe; widening it is the thing to be suspicious of.
#   2. operator   If adopting it, set the repository variable
#                 GATE_MANIFEST_APPROVED_HASH_G1 to the SHA-256 of these exact
#                 committed bytes. Settings -> Secrets and variables -> Actions
#                 -> Variables. The value is the one governance.yml prints as
#                 `actual:`; it is computed from the LF bytes the runner checks
#                 out, so a hash taken from a Windows working copy with CRLF
#                 line endings will NOT match.
#                 If this file is edited at all, its hash changes and the
#                 variable must be reset to the new value.
#   3. operator   Merge PR #1. INV-20: the implementer does not merge its own
#                 gate.
#
# Step 2 is what makes any of this real. Until it is done the Governance check
# fails closed at the hash step, the scope step is never reached, and G1 has no
# enforced scope -- which is the correct behaviour, and is the negative-control
# evidence recorded in ../plans/G1_PREADOPTION_EVIDENCE.md.
# ---------------------------------------------------------------------------
