# ---------------------------------------------------------------------------
# PLAN PROVENANCE, pinned to immutable objects rather than to a moving ref.
#
# An earlier revision of the plan that produced this file said to recompute
# this value from `HEAD:governance/plans/G1_REMEDIATION_PLAN.md`. GPT-PM caught
# that as a MAJOR and it was a real defect: HEAD moves, and this file is
# committed while checked out on main, where the SAME PATH is a DIFFERENT,
# OLDER OBJECT. Measured 2026-09-11:
#
#   main                 blob 3df2f47c754513df2d363008a94d10127675c027   7681 bytes
#   gate/g1-remediation  blob 5f48ca301835d79d4512cafb077c4abb644745be  13678 bytes
#
# Executed as originally written, the recompute would have hashed the 7681-byte
# copy and written provenance into this document that pointed at the wrong
# object -- and nothing downstream would have caught it, because plan_hash is
# not enforced by CI (limitation 3). The pin below is therefore to a commit and
# a blob, both immutable, and the command that reproduces it names that commit
# and never HEAD:
#
#   git cat-file -p 5bbf783ceaa6a18f6eff0bd98ca091f0d4292b17:governance/plans/G1_REMEDIATION_PLAN.md | sha256sum
#
# DISCLOSED TRANSITIONAL STATE, accepted rather than hidden: the pinned blob
# currently exists only on gate/g1-remediation. It reaches main when PR #1
# merges. So between this commit and that merge, main carries a manifest whose
# plan_hash names an object not yet in main's own ancestry. The object is fully
# addressable by commit and blob id, the difference is recorded here, and the
# merge resolves it. GPT-PM reviewed this and accepted it as a disclosed
# transitional state, not a defect.
plan_source_commit: 5bbf783ceaa6a18f6eff0bd98ca091f0d4292b17
plan_source_blob: 5f48ca301835d79d4512cafb077c4abb644745be
plan_source_bytes: 13678
plan_hash: 91b4dd9a242a1241d94e3f4bbdb7fb0328be890e3f004b16b71a9e66a87bbb1d

# Written so it stays true both before and after the approval hash is set: it
# describes what the scope IS, and states what its authority is contingent on,
# rather than asserting a status that a later operator action would contradict.
approved_scope: >-
  G1 merge scope -- repository, governance enforcement, CI and contracts on
  branch gate/g1-remediation: the G1-M2 remediation already built, plus the
  remaining closure work (first genuine CI evidence, negative controls,
  R11/R12/R13 record correction, fresh review, closure report). This scope is
  authoritative only while GATE_MANIFEST_APPROVED_HASH_G1 matches the SHA-256
  of these exact committed bytes; absent that match the Governance check fails
  closed and G1 has no enforced scope at all.

# ---------------------------------------------------------------------------
# allowed_paths
#
# WHAT THIS LIST IS SCOPED TO: the permissible MERGE SCOPE of the G1 pull
# request, not "the work still to be done". The check runs
# `git diff BASE_SHA...HEAD_SHA` and evaluates the CUMULATIVE range from the
# main base to the PR head -- so a manifest listing only future actions would
# fail the scope check on paths this branch already carries, the moment the
# hash was set. This is not retroactive authorization of the branch's
# individual mutations: those were authorized, or not, when they happened, and
# ../../core/DECISION_LOG.md records which. A manifest authorizes what may
# legitimately arrive on main through this gate's PR.
#
# Derived from three sources: the G1 remediation plan pinned above, the G1
# findings and their DoD, and the actual measured state of
# gate/g1-remediation. Every entry is justified in the comment above it and
# tagged with which half of the merge scope it comes from:
#
#   [CUMULATIVE]  already in the branch's diff against main, because an
#                 approved G1 remediation finding required it
#   [REMAINING]   not in the diff yet; a named remaining G1 closure action
#                 needs it
#   [BOTH]        already present AND needed again before closure
#
# Tags re-derived 2026-09-11 from the real diff, not carried forward.
#
# An entry needed only by a future gate is not here; see "deliberately
# excluded" below.
#
# Grammar is the segment-bounded one scripts/verify/check-gate-scope.mjs
# enforces, NOT shell globbing: `*` matches within one path segment and never
# crosses `/`, `**` is a whole segment. There is no bare `**` anywhere in this
# file -- a manifest containing one cannot refuse anything, and the checker
# warns about it on every run for exactly that reason.
# ---------------------------------------------------------------------------

allowed_paths:
  # [BOTH] G1-M2/G1-M3. The entries for /scripts/verify/ and /docs/architecture/
  # were added on this branch. Still remaining: this file's own header currently
  # asserts that it "is the control that actually enforces" the separation
  # invariant, which R13 narrows -- with one GitHub account, CODEOWNERS cannot
  # mechanically prove operator-vs-implementer identity separation.
  - .github/CODEOWNERS

  # [BOTH] G1-M2 itself: policy-integrity.yml and gate-scope.yml were replaced by
  # the single governance.yml. All three paths are in this branch's diff, two of
  # them as deletions. ci.yml is covered by the same segment-bounded pattern
  # because the PR was the first time CI on this repository ever executed a step
  # (R11), and a workflow observed running for the first time is likely to need
  # a correction. `*` does not cross `/`, so this reaches the workflow files and
  # nothing below them.
  - .github/workflows/*.yml

  # [CUMULATIVE] Reports are conformed by a tool that injects a provenance block
  # by matching its own markup, and prettier was rewriting it. Landed with the
  # G1-M2 commit.
  - .prettierignore

  # [BOTH] Governance instructions for the two agent surfaces and the
  # repository's front page. All three were updated for the one-workflow layout.
  # Still remaining: each must be checked for the same overclaim as CODEOWNERS
  # above, and narrowed where it appears -- narrowed, not replaced by the
  # opposite overclaim that every GitHub control is procedural.
  - AGENTS.md
  - CLAUDE.md
  - README.md

  # [CUMULATIVE] Toolchain: @eslint/js declared explicitly, tests/**/*.ts added
