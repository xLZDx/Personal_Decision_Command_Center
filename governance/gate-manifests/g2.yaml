# ---------------------------------------------------------------------------
# allowed_paths
#
# Derived from V3's own §2-§5 (the exact DDL/SQL/TypeScript already
# executably validated in a scratch harness) and the TDD's canonical repo
# layout (docs/architecture/TDD.md:2319-2381). Every entry is justified
# below. Segment-bounded grammar, per scripts/verify/check-gate-scope.mjs:
# `*` matches within one path segment, `**` is a whole segment, no bare `**`.
# ---------------------------------------------------------------------------

allowed_paths:
  # The D1 schema itself. Not yet applied to any live D1 instance (confirmed
  # by database-reviewer's own read during the architecture round) -- edited
  # in place, not superseded by a 0002 migration, per that same finding.
  - infra/migrations/0001_ingest_outbox.sql

  # The connector-neutral contracts V3 changes: source_version (idempotency),
  # MAX_ROUTING_HINTS, the generic provenanceValueSchema<T> factory and its
  # concrete instantiations, the MESSAGE_UPDATED superRefine.
  - packages/contracts/src/*.ts
  - packages/contracts/tests/*.ts

  # The provenance DAG: fail-closed isAiSafe, discriminated node schemas
  # (SourceEventNode/StaticConfigNode/DerivedNode), sourceEventNode()'s
  # corrected source_policies resolution.
  - packages/provenance/src/*.ts
  - packages/provenance/tests/*.ts

  # New per the canonical layout and V3's design: SQL builders / D1 batch
  # helpers for the reconciler and processor transition protocol described
  # in V3 §2-§3. Does not exist yet -- this gate creates it.
  - packages/domain/**

  # New: shared test fixtures for the ingest/outbox/DLQ pipeline, per the
  # canonical layout's packages/testkit entry.
  - packages/testkit/**

  # New: the ingest Worker (fetch handler for connector-submitted events, and
  # the scheduled handler running the Phase 1 lease-sweep + Phase 2
  # reconciler dispatch described in V3 §3).
  - services/ingest/**

  # New: the Queue consumer Worker implementing the claim CAS and the four
  # fenced outcome transitions (SUCCESS/RETRYABLE_FAILED/DLQ) from V3 §2-§3.
  - services/processor/**

  # Cloudflare bindings/config for the two new Workers (D1, Queue, Cron
  # Trigger) -- wrangler configuration lives here per the canonical layout's
  # infra/cloudflare entry, not inside each service directory.
  - infra/cloudflare/**

  # New/updated automated tests proving the invariants this gate's own
  # executable scratch validation already demonstrated ad hoc: FK/CHECK
  # enforcement, EXPLAIN QUERY PLAN index coverage, the ABA lease-fencing
  # regression, the four processor-transition scenarios, the idempotency
  # behavioral matrix.
  - tests/unit/**
  - tests/contract/**
  - tests/integration/**
  - tests/resilience/**
  - tests/quota/**
  - tests/fixtures/**

  # The G2-owned ADR gets an addendum recording the lease-token/heartbeat
  # protocol and the processing/transport column split -- not a rewrite, an
  # addition, per that ADR's own amendment convention (see ADR-006 itself).
  - core/adr/ADR-006-durable-ingest-outbox.md

  # Durable decisions: this gate's own record, already three rounds deep.
  - core/DECISION_LOG.md

  # The gate ledger's own G2 row moves from BLOCKED to whatever this gate's
  # real status becomes as work lands.
  - core/PLAN_MASTER_GATES.md

  # This gate's own proposal documents may still gain a closure-status
  # update once implementation is verified against them.
  - governance/plans/G2_PIPELINE_ARCHITECTURE_PROPOSAL.md
  - governance/plans/G2_PIPELINE_ARCHITECTURE_PROPOSAL_V2.md
  - governance/plans/G2_PIPELINE_ARCHITECTURE_PROPOSAL_V3.md

  # The closure report. Does not exist yet.
  - governance/G2_CLOSURE_REPORT.md

  # Independent-review artifacts this gate's own review round produces.
  - governance/reviews/**

  # Errata for any concrete detail V3 records as a deliberate deviation from
  # a TDD passage's literal wording (e.g. the lease-renewal/heartbeat
  # mechanism in place of a single fixed TTL) -- never an invariant amendment.
  - docs/architecture/TDD_ERRATA.md

  # The mandated report pair for this gate's closure.
  - reports/*.html

  # This gate's own guard scripts, if V3's DoD needs a new executable check
  # (e.g. an EXPLAIN QUERY PLAN assertion harness) beyond what npm test
  # already runs.
  - scripts/verify/*.mjs

  # Toolchain touches expected if the two new Workers need their own
  # package.json/tsconfig entries under the existing workspaces glob.
  - package.json
  - package-lock.json

# ---------------------------------------------------------------------------
# forbidden_paths
#
# Same class as g1.yaml's: touching one would be the implementer granting
# itself authority, not merely working outside scope.
# ---------------------------------------------------------------------------

forbidden_paths:
  # INV-28, identical reasoning to g1.yaml: a gate PR carrying its own
  # authorizing manifest would validate a diff against a file that same diff
  # had just written. This candidate reaches main via manifest-proposal/g2,
  # a branch whose own check requires it to touch exactly one file -- this
  # one -- and nothing else, so it can never appear inside gate/g2-
  # implementation's own diff either.
  - governance/gate-manifests/**/*.yaml
  - governance/gate-manifests/**/*.yml

  # The operator's own record of what they approved.
  - governance/operator-approvals/**

  # The frozen architecture baseline. TDD_ERRATA.md exists so a concrete
  # detail can be corrected without amending this file.
  - docs/architecture/TDD.md

  # CI/governance machinery itself -- not a G2 deliverable, and touching it
  # from inside a gated PR is exactly the self-modification class G1's own
  # closure review found and fixed.
  - .github/**
  - .github/CODEOWNERS

# ---------------------------------------------------------------------------
# The fields below are part of the manifest shape described in
# ./README.md. The checker reads allowed_paths and forbidden_paths and
# NOTHING ELSE. These are documentation for a human reviewer, not enforcement.
# ---------------------------------------------------------------------------

