#   2. operator   If adopting it, set the repository variable
#                 GATE_MANIFEST_APPROVED_HASH_G2 to the SHA-256 of these
#                 exact committed bytes (the value governance.yml prints as
#                 `actual:` on the manifest-proposal/g2 PR -- computed from
