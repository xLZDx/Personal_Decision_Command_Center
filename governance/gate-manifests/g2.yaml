# OPERATOR-DIRECTED, IMPLEMENTER-AUTHORED G2 MANIFEST CANDIDATE.
#
# This file has no governance authority merely because it exists on main.
# Its scope becomes authoritative only after the operator reviews these exact
# committed bytes and sets GATE_MANIFEST_APPROVED_HASH_G2 to their matching
# SHA-256.
#
# THE CI-REPORTED HASH IS PROVIDED TO AVOID BYTE / LINE-ENDING MISTAKES.
# IT IS NOT A SUBSTITUTE FOR READING THIS MANIFEST.
#
# .github/workflows/governance.yml prints this file's actual sha256 (via
# scripts/verify/check-manifest-proposal.mjs, the manifest-proposal/g<N> path)
# when the approval variable is unset. Setting that printed value without
# reading what follows approves the paths below sight-unseen.
#
# ---------------------------------------------------------------------------
# WHY AN IMPLEMENTER WROTE THE OPERATOR'S DOCUMENT
#
# Same authority split as g1.yaml (see that file's own header for the full
# GPT-PM ruling this mirrors): the operator delegated GO-level authoring and
# autonomous execution through MVP1 ("план меняется ГО делать все до конца...
# тоесть ГО закончить мвп 1 автономно автаризирую", 2026-09-13, recorded in
# core/DECISION_LOG.md), but GPT-PM's prior ruling on G1 -- that the approving
# half (setting the hash) is not delegable, because a party that both authors
# and installs its own binding hash proves nothing about scope authority
# (NM3) -- was never narrowed to G1 specifically. It is a property of the
# mechanism, not of one gate, and this manifest treats it as still binding
# until GPT-PM or the operator says otherwise for G2 by name.
#
# ---------------------------------------------------------------------------
# HOW THIS DIFFERS FROM g1.yaml'S BOOTSTRAP
#
# g1.yaml was committed directly to main before branch protection existed.
# main is now ruleset-protected, so this candidate reaches main through the
# manifest-proposal/g2 branch bootstrap path (scripts/verify/
# check-manifest-proposal.mjs), added specifically to close that gap during
# G1's own second closure review. This is the first real use of that
# mechanism for a genuinely new gate (as opposed to the amendment path, which
# is untested by any live PR at all as of this writing).
#
# Per global CLAUDE.md §24 (narrowed 2026-09-12: the authority-surface
# carve-out for governance/gate-manifests/** PRs was removed by explicit
# operator instruction), Claude may merge the manifest-proposal/g2 PR itself
# once GPT-PM returns a genuine, correlated VERDICT: APPROVE on its exact
# head and required checks are green -- but that merge only ever makes THIS
# CANDIDATE visible on main. It does not, and cannot, set the approval hash.
# That step has no PR to ride on; it is a repository-variable change only the
# operator makes, by design.
#
# ---------------------------------------------------------------------------

