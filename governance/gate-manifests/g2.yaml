#   3. operator   Set the repository variable GATE_ACTIVE=G2 once ready for
#                 G2 implementation PRs to resolve against this manifest.
#                 Until then, no PR labeled Gate: G2 can pass gate
#                 resolution at all, regardless of this file's hash.
#   4. Claude     May merge the manifest-proposal/g2 PR itself once GPT-PM
#                 returns VERDICT: APPROVE on its exact head and required
#                 checks are green (global CLAUDE.md §24, post-2026-09-12
#                 removal of the authority-surface carve-out) -- but per (2)
#                 and (3) above, that merge alone authorizes nothing.
#
# Step 2 is what makes any of this real. Until it is done the Governance
# check fails closed at the hash step for any G2-labeled PR, and G2 has no
# enforced scope -- which is the correct behaviour.
# ---------------------------------------------------------------------------
