# NON-BINDING IMPLEMENTER PROPOSAL FOR GATE G2.
# This file does not authorize any mutation, and it is not in the repository.
#
# Only an operator-authored or operator-adopted copy at
# governance/gate-manifests/g2.yaml, plus the operator-set repository variable
# GATE_MANIFEST_APPROVED_HASH_G2 matching that file's exact committed bytes, has
# any authority (INV-28). Until both exist, .github/workflows/governance.yml
# fails closed at the hash step for any PR resolving to G2, the scope step is
# never reached, and G2 has no enforced scope at all -- which is the correct
# behaviour, not a defect to work around.
#
# WHY THIS FILE IS IN A SCRATCHPAD AND NOT IN THE REPOSITORY
#
# Two independent reasons, both sufficient on their own:
#
#   1. INV-28. A manifest an implementer can freely write has no authority. The
#      G1 precedent (governance/gate-manifests/g1.yaml, header) shows the ONE
#      way that changed: the operator explicitly delegated the AUTHORING of a
#      manifest in writing, and GPT-PM ruled that even then the APPROVING half
#      -- setting the hash -- stayed with the operator. No such delegation
#      exists for G2. So this is a proposal, in the shape G1's own proposal took
#      (governance/plans/G1_MANIFEST_PROPOSAL.yaml), and nothing more.
#   2. governance/gate-manifests/** is mechanically forbidden to every gate PR
#      and, via scripts/verify/check-floor-scope.mjs, to every ungated PR as
#      well. A file placed there by an implementer could not legally reach main
#      through any PR that exists today. Writing one would not create authority;
#      it would only create a file that cannot merge.
#
# READ "operator-controlled" AS GOVERNANCE AUTHORITY, NOT TECHNICAL
# EXCLUSIVITY. As measured at G1 (governance/plans/G1_PREADOPTION_EVIDENCE.md
# section 3.1), the credential available to the implementer session is a classic
# PAT with repo/workflow/admin:org and admin on this repository: it CAN set the
# approval variable and edit the workflow. The separation is procedural.
#
#   operator-authorized  !=  technically operator-exclusive
#
# ---------------------------------------------------------------------------
# THE TWO THINGS THAT BLOCK G2 TODAY, STATED BEFORE THE SCOPE
#
#   1. G1 is not closed. governance/G0_CLOSURE_REPORT.md: "G2 does not begin
#      until G1 closes properly." G1 is remediated (manifest adopted, hash set,
#      PR #1 and PR #3 merged, ruleset PDCC active) but has no final verdict and
#      no governance/G1_CLOSURE_REPORT.md.
#   2. G2-PREFLIGHT-01/02/03 -- see the g2_preflight block below, which is the
#      honest status and not a summary of intentions.
#
# Adopting this manifest does not unblock either one. A manifest defines what a
# gate's PR may touch; it never authorizes the gate to start. That still needs
# G1's closure and a plan-level GO (core/PLAN_MASTER_GATES.md, project
# CLAUDE.md section 4).
# ---------------------------------------------------------------------------

status:
  - NON_BINDING_PROPOSAL
  - IMPLEMENTER_AUTHORED
  - HAS_NO_AUTHORITY
  - G2_NOT_YET_AUTHORIZED_AND_NOT_YET_UNBLOCKED

authored_by: Claude (implementer), unsolicited draft for operator review
authored_on: 2026-09-11
authored_at_commit: 9355864
approval_reserved_to: operator (@xLZDx), via GATE_MANIFEST_APPROVED_HASH_G2

gate: G2

# The workflow resolves the gate from a `gate/g<N>-...` branch name or a
# `Gate: G<N>` line in the PR body (.github/workflows/governance.yml, step
# "Resolve the gate this PR belongs to"). No G2 branch exists yet, and creating
# one is its own authorization under global CLAUDE.md section 14/20 -- not
# something adopting this manifest grants. The name below is a suggestion so the
# regex match is predictable, not a branch that has been approved.
branch: gate/g2-d1-ingest-queue (NOT CREATED; needs its own authorization)

# ---------------------------------------------------------------------------
# PLAN PROVENANCE -- AND THE HONEST GAP IN IT
#
# There is no G2 plan. governance/plans/ contains G0_PLAN.md, the G1 remediation
# plan, the G1 proposal and the G1 pre-adoption evidence, and nothing for G2. So
# plan_id and plan_hash below cannot be filled in with a true value today.
#
# This matters more than it looks. G1's manifest pinned its plan to an immutable
# commit+blob precisely because an earlier draft would have hashed the wrong
# object. Here there is no object at all to pin. A manifest adopted before the
# plan exists pins nothing, and its approved_scope was derived from the master
# gate plan and the TDD rather than from a reviewed G2 plan.
#
# Recommended ordering, which is the operator's call and not this file's:
# write governance/plans/G2_PLAN.md first, have GPT-PM review it, then adopt a
# manifest whose plan_hash names that plan's blob. Adopting in the other order
# is possible -- nothing in CI reads plan_hash (limitation 7 in
# governance/GATE_MANIFEST_INTEGRITY.md) -- but it produces a manifest whose
# provenance fields are decoration.
# ---------------------------------------------------------------------------
plan_id: NOT_YET_ASSIGNED (no governance/plans/G2_PLAN.md exists)
plan_hash: NOT_COMPUTABLE (no plan file to hash)

approved_scope: >-
  NOT APPROVED. Proposed scope: G2 -- D1 schema and migrations, provenance and
  policy primitives, the durable ingest/outbox path, the Queue consumer,
  reconciler and DLQ, the Free-Queue soft-budget guard, the CPU/D1-query quota
  harness, the three blocking preflight items, and the live Analytics Engine
  limits snapshot. Runtime work stays inside the conservative ~10 ms active-CPU
  budget (INV-27) and the D1 50-queries-per-invocation ceiling (R10). Excludes
  every connector, the resolver, the decision layer, the PWA, and everything
  else assigned to G3..G10.

# ---------------------------------------------------------------------------
# G2 PREFLIGHT STATUS -- BINDING CARRY-FORWARD FROM G0 CLOSURE
#
# Recorded here rather than only in governance/G0_CLOSURE_REPORT.md because a
# manifest is the document the operator reads at adoption time, and adopting a
# scope without seeing the preflight state would hide the one item that can
# still change G2's architecture. Each status below was checked against the
# repository on 2026-09-11, not carried forward from prose.
# ---------------------------------------------------------------------------

g2_preflight:
  preflight_01_queue_consumer_cpu_probe: >-
    MEASURED, BUT THE EVIDENCE IS NOT ON main. Run 2026-09-11 on the operator's
    own Free account: the queue-consumer ladder completes 1e5 SHA-256 rounds and
    is killed at 1e6, and the plain HTTP ladder breaks at the same point --
    identical budgets, so INV-27's conservative ~10 ms assumption is CONFIRMED
    by measurement rather than by ruling. The record is
    scripts/probes/cloudflare-free-cpu/RESULTS.md on branch
    evidence/g0-cpu-probe-results, carried by PR #2, which is still OPEN. Two
    caveats the file states about itself: the dashboard p50/p99 CPU-ms reading
    was never captured, and the Free plan label comes from account creation
    rather than a dashboard re-check.
  preflight_02_http_pull_and_ack: >-
    UNKNOWN / BLOCKING. Never attempted. The probe's wrangler.toml declares
    [[queues.consumers]] -- a PUSH consumer -- and its single msg.ack() is the
    push-batch API. An HTTP pull consumer is a different mechanism (REST
    pull/ack) and appears nowhere in this repository. Whether Cloudflare offers
    HTTP pull consumers on the Free plan at all is unpublished (R9).
  preflight_03_d1_query_budget_in_harness: >-
    BLOCKING. Not done. The <=50-queries-per-Worker-invocation ceiling is
    recorded in five prose places (EXTERNAL_ASSUMPTIONS.md, ADR-011,
    TDD_ERRATA.md, R10, the G0 closure report), but the item says IN THE QUOTA
    HARNESS, and R10's own mitigation says that harness must count queries per
    invocation, not just CPU. scripts/quota/ exists as an empty placeholder --
    git ls-files finds 0 files in it. Note the circularity this creates: the
    harness that satisfies the preflight is itself part of G2's declared scope,
    which is why scripts/quota/** is in allowed_paths below.
  queue_runtime_choice: >-
    NOT VERIFIED, and cannot become VERIFIED until all three items above
    complete. This is a binding carry-forward from G0 closure (ADR-011 status
    block; governance/G0_CLOSURE_REPORT.md, "Carried forward as blocking G2
    preflight"), not a preference this file is expressing.
  pull_consumer_is_not_yet_a_fallback: >-
    No statement anywhere in this document says the HTTP pull consumer IS the
    fallback. ADR-011 calls it a pre-approved fallback; that wording states an
    availability nobody has measured, and RESULTS.md was already corrected once
    on 2026-09-11 for making the same over-claim. Treat it as unavailable until
    PREFLIGHT-02 measures otherwise.
  preflight_02_outcome_branch_a_available: >-
    If a real HTTP pull + ack succeeds on the Free account, ADR-011's fallback
    remains valid exactly as written, no correction is owed, and G2 runtime
    implementation proceeds on the Worker consumer with a genuine escape hatch
    behind it. core/RISK_REGISTER.md R9 closes with that evidence attached.
  preflight_02_outcome_branch_b_unavailable: >-
    If pull consumers are unavailable on Free, ADR-011 MUST be corrected BEFORE
    any G2 runtime implementation begins -- it must stop describing a pull
    consumer as a fallback, and the architecture must be recorded as having no
    escape hatch above ~10 ms of consumer CPU. That is the G0 closure report's
    own wording. The practical consequence for G2: the consumer design has no
    margin to spend, so the single-batched-candidate-query rule and the bounded
    scoring rule stop being good practice and become the only design that works.
    core/adr/ADR-011-queue-consumer-runtime.md is in allowed_paths below for
    exactly this branch.

# ---------------------------------------------------------------------------
# allowed_paths
#
# WHAT THIS LIST IS SCOPED TO: the permissible MERGE SCOPE of G2's pull
# request(s). The check runs `git diff BASE_SHA...HEAD_SHA` over the cumulative
# range from the main base to the PR head, so this is "what may legitimately
# arrive on main through this gate", not "what is left to do".
#
# Derived from: core/PLAN_MASTER_GATES.md's G2 row and TDD section 83; the
# component DoDs that apply to G2 (TDD section 71 Queue/Reliability, section 70
# Provenance/AI policy tests, section 35 D1 design/quota budget, section 62
# mandatory resilience tests); the three preflight items; the TDD section 55
# repository tree; and the measured state of the repository at 9355864, where
# apps/, services/, connectors/, host/ and infra/ contain zero tracked files.
#
# DELIBERATE OVERLAP WITH OTHER GATES. Manifests are not a disjoint partition of
# the tree and should not be contorted into one. Shared governance, test and
# report surfaces legitimately repeat between gates, and each such entry below
# says so in its own comment. What must not happen is an UNEXPLAINED overlap or
# a path that lets G2 do another gate's work.
#
# Grammar is the segment-bounded one scripts/verify/check-gate-scope.mjs
# enforces, NOT shell globbing: `*` matches within one segment and never crosses
# `/`; `**` is a whole segment. There is no bare `**` in this file -- a manifest
# containing one cannot refuse anything, and the checker warns on every run for
# that reason.
# ---------------------------------------------------------------------------

allowed_paths:
  # D1 SCHEMA. The first .sql in the repository lands here. TDD section 35
  # requires indexes in migration 001, no growing-table full scan in the hot
  # path, and a reviewed query plan for topic candidate selection -- so the
  # migration files and whatever runs them are one unit of review.
  - infra/migrations/**

  # Worker/Queue/D1 bindings, queue definitions, and the soft-budget guard's
  # configuration. Kept under infra/cloudflare/ per TDD section 55 rather than a
  # root wrangler.toml, so that deployment configuration is never mistaken for
  # repository tooling.
  - infra/cloudflare/**

  # PROVENANCE PRIMITIVES. PROVENANCE_MODEL.md names these two packages as the
  # implementation of the provenance/AI-policy rule "starting at G2", and NM2's
  # closure condition in core/RISK_REGISTER.md requires an automated policy test
  # at G2/G6 rather than an assertion in docs. Both directories exist and are
  # empty today.
  - packages/provenance/**
  - packages/policy/**

  # The normalized event and queue message contracts. packages/contracts/ is the
  # only tracked source in the repository (7 files, landed at G1 as bootstrap);
  # G2 is the gate that gives ADR-004 a real contract to be about, and the
  # durable-ingest idempotency key (TDD section 14) is a contract change, not an
  # implementation detail. Overlap with G1 is historical, not concurrent: G1's
  # own manifest deliberately excludes this path.
  - packages/contracts/**

  # Test support for the first real test surface this project has had beyond the
  # policy tests: fixtures and fakes for the resilience and quota harnesses. In
  # scope because the alternative is that harness helpers colonize a production
  # package. INV-12 applies to fixtures too -- no raw message bodies.
  - packages/testkit/**

  # The quota counters the soft-budget guard reads (TDD section 16.3's
  # MAX_DISPATCHED_QUEUE_MESSAGES_PER_DAY, section 35's "quota counters visible
  # in OPS", section 36's Analytics-Engine-not-D1 rule for high-volume metrics).
  # Counting is G2; dashboards and reporting are G8, and this entry does not
  # reach them -- OBSERVABILITY.md is deliberately excluded below.
  - packages/telemetry/**

  # DURABLE INGEST. POST /ingest, authenticate/validate/dedupe, the single D1
  # transaction that writes ingest_event=ACCEPTED plus outbox=PENDING, then the
  # source ACK (TDD section 14). Directory exists, zero tracked files.
  - services/ingest/**

  # THE QUEUE CONSUMER, RECONCILER AND DLQ. Bound by INV-27 (~10 ms active CPU,
  # now measured, not assumed), INV-29 (terminal FAILED/DLQ never automatically
  # reconciled), NM4 (poison event terminates in <=MAX_PROCESSING_ATTEMPTS) and
  # R10 (one batched candidate query, never a per-candidate loop). Note what
  # this entry does NOT include: services/resolver/ is G5's, so G2 may build the
  # bounded candidate FETCH the consumer needs without building the resolver.
  - services/processor/**

  # THE QUOTA/CPU HARNESS -- G2-PREFLIGHT-03. Empty today. R10 requires it to
  # count D1 queries per invocation, not only CPU; TDD sections 35 and 62
  # require 200/day and 1000/day simulations recording D1 writes/reads, Queue
  # ops, Analytics datapoints and HTTP requests per event.
  - scripts/quota/**

  # G2-PREFLIGHT-01 and -02. The existing probe measured the push-consumer CPU
  # ladder; PREFLIGHT-02 needs a genuinely different mechanism (REST pull + ack)
  # added to it or beside it. This is evidence-gathering, which is why it lives
  # under scripts/probes/ and not under host/optional-http-pull-consumer/ --
  # measuring whether a fallback exists is not implementing one, and host/ stays
  # excluded below. Overlaps G0's evidence surface by necessity: the probe is
  # already written and PREFLIGHT-02 extends it rather than starting over.
  - scripts/probes/cloudflare-free-cpu/**

  # The live limits snapshot tooling for G2's "live Analytics Engine limits
  # snapshot" deliverable. Directory exists, empty. The snapshot RECORD goes in
  # EXTERNAL_ASSUMPTIONS.md below; this is whatever fetches it.
  - scripts/probes/free-tier-snapshot/**

  # TESTS. One entry per test class G2 actually owes, rather than a single
  # tests/** that would also hand G2 the e2e and security suites belonging to
  # G4/G7. Mapping: quota = TDD section 35 budget tests and the CPU/query
  # harness assertions; resilience = TDD section 62's queue-outage, 24h-expiry,
  # poison-event, soft-budget and D1-transient-error cases; contract = the
  # normalized event and queue payload contracts; integration = ingest ->
  # outbox -> queue -> processor; unit = everything below that; fixtures =
  # their inputs, which INV-12 forbids from carrying raw content.
  - tests/quota/**
  - tests/resilience/**
  - tests/contract/**
  - tests/integration/**
  - tests/unit/**
  - tests/fixtures/**

  # Policy tests. NM2's closure condition names G2 explicitly: the Telegram-
  # ancestry and Topic/Stream/Person type-boundary blocks of TDD section 70 must
  # be proven by automated tests at G2/G6. This overlaps G1's surface, and the
  # overlap is bounded by three forbidden entries below: G1's OWN policy tests
  # -- the ones that prove the gate-scope, floor-scope and CODEOWNERS checks
  # actually bite -- stay untouchable from inside G2.
  - tests/policy/**

  # Toolchain. G2 adds real workspaces under services/ and packages/ (the
  # workspace globs in package.json already cover them), plus the first runtime
  # dependencies this project has had -- a Workers toolchain and a local D1 for
  # the harness. vitest.config.ts already includes services/**/tests and
  # tests/**, so new suites run in CI without touching any workflow; that is the
  # reason .github/workflows/** can stay forbidden below.
  - package.json
  - package-lock.json
  - tsconfig.json
  - vitest.config.ts

  # The first real TypeScript service sources arrive at G2, and Workers globals
  # and .sql-adjacent files are not covered by a config written for a docs-and-
  # scripts repository.
  - eslint.config.js

  # .wrangler/ and *.sqlite are already ignored; `.dev.vars` -- wrangler's local
  # secret file, which G2 is the first gate to need -- matches nothing in the
  # current .gitignore. This entry exists so that gap can be closed inside the
  # gate that opens it. See also the two secret-file entries in forbidden_paths.
  - .gitignore

  # Durable decisions and evidence future gates need: the schema shape chosen,
  # what the preflight measured, and any deviation taken. Hook-enforced on every
  # commit in this workspace. Shared with every gate by design.
  - core/DECISION_LOG.md

  # R8, R9 and R10 are all G2-preflight risks and all three get their status
  # corrected by this gate's own measurements -- R9 in whichever direction
  # PREFLIGHT-02 actually points. NM2 and NM4's "verification owed" rows are
  # also G2's to discharge.
  - core/RISK_REGISTER.md

  # G2's own row in the gate ledger. Note for the operator: that table's "G0
  # required outputs" block still reads PENDING/DRAFT for items B, C, D, F..O
  # while governance/G0_CLOSURE_REPORT.md reads them as closed. G1's manifest
  # flagged the same contradiction and it is still unresolved at 9355864. If G1
  # does not fix it, G2 inherits an internally contradictory ledger.
  - core/PLAN_MASTER_GATES.md

  # ADRs, named individually rather than as core/adr/** -- an ADR is an adopted
  # decision record and a gate should not be able to amend one it has no
  # business in. Each of these five names G2 in its own text:
  #   004  placeholder, "to be written and adopted no later than G2 planning"
  #   006  same, the durable ingest/outbox decision itself
  #   011  "verification owed at gate time (G0 item E, G2)", and the mandatory
  #        correction under PREFLIGHT-02 branch (b) above
  #   005  "verification owed at gate time (G2 primitives, G6 AI integration)"
  #   010  "verification owed at gate time (G2, G8)" -- the HARD_ZERO budget
  # CODEOWNERS owns /core/adr/, so the operator still approves each merge.
  - core/adr/ADR-004-normalized-event.md
  - core/adr/ADR-005-value-provenance-dag.md
  - core/adr/ADR-006-durable-ingest-outbox.md
  - core/adr/ADR-010-hard-zero-cost.md
  - core/adr/ADR-011-queue-consumer-runtime.md

  # One reserved number for a NEW G2 decision record -- realistically the D1
  # schema/migration strategy or the reconciler's scheduling mechanism. Reserving
  # exactly one is deliberate friction: a second new ADR means re-reading and
  # re-hashing this manifest, which is the right cost for a gate that wants to
  # record two architecture decisions nobody planned for.
  - core/adr/ADR-012-*.md

  # DATA_MODEL.md says of itself that it "gets expanded into real migrations/
  # schema at G2, at which point this file should start carrying the actual
  # entity-relationship detail and diverge from being a pointer". This entry is
  # that sentence's authorization.
  - docs/architecture/DATA_MODEL.md

  # PROVENANCE_MODEL.md is an index whose implementation begins at G2; once
