# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST CANNOT DO, EVEN IF ITS HASH IS APPROVED
#
#   1. It cannot make G2 startable. G1's closure and a plan-level GO are
#      separate requirements, and the three preflight items are separate again.
#   2. It cannot tell a tightening from a loosening. The scope check sees a
#      changed path, never the direction of the change. Branch protection plus
#      code-owner review is what covers direction, and per CODEOWNERS the
#      directories most at risk here (/docs/architecture/, /core/adr/) are
#      already operator-owned.
#   3. The `Gate: G2` label that selects this manifest comes from the branch
#      name or the PR body, both written by the implementer. A PR that declared
#      a different gate would be checked against a different manifest
#      (limitation 6 in governance/GATE_MANIFEST_INTEGRITY.md) -- or, declaring
#      `Gate: NONE`, against the floor scope, which allows everything except the
#      five paths in check-floor-scope.mjs. Three of this file's own forbidden
#      entries -- scripts/verify/**, the three G1 policy tests, the two secret
#      files -- are NOT in that floor list, so the ungated path is genuinely
#      weaker than this manifest on exactly those paths.
#   4. Nothing checks plan_id or plan_hash, which is just as well here, since
#      neither can be filled in truthfully today.
#   5. The check runs on pull_request only. A direct push to main is not
#      examined by it at all; the `PDCC` ruleset, not this file, is what closes
#      that.
#   6. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH (G1
#      limitation 5, measured 2026-09-10 and unchanged). The separation remains
#      procedural until the credential model changes.
#   7. An implementer wrote it. The only control standing between that and a
#      self-authorized scope is the operator actually reading these bytes.
#
# ---------------------------------------------------------------------------
# OPEN QUESTIONS ONLY THE OPERATOR CAN SETTLE
#
#   1. ADOPTION ORDER. Adopt a manifest now with an empty plan_hash, or write
#      governance/plans/G2_PLAN.md first and adopt a manifest that pins it? This
#      file recommends the second and does not assume it.
#   2. .github/workflows/** stays forbidden, which means TDD section 61's
#      "migration validation" CI requirement must be satisfied by a vitest test
#      rather than a workflow step, and any genuinely new CI job for G2 needs
#      this manifest widened and re-hashed mid-gate. Accept that friction, or
#      pre-authorize .github/workflows/ci.yml alone (never governance.yml)
#      before the gate starts?
#   3. docs/architecture/THREAT_MODEL.md is excluded. G2 adds the first
#      authenticated endpoint and the first stored platform credentials. Add it?
#   4. reports/*.html is segment-bounded and would refuse reports/gate-2/*.html,
#      which is the layout TDD section 55 sketches. Keep the flat convention the
#      repository actually uses, or widen to reports/**?
#   5. core/adr/ADR-012-*.md reserves exactly one new decision record. Enough?
#   6. PREFLIGHT-02 is the only preflight item with architectural consequence.
#      Its branch (b) requires correcting ADR-011 BEFORE any G2 runtime
#      implementation. Does the operator want that correction as its own small
#      operator-approved change, or inside G2's PR under the ADR-011 entry above?
#
# ---------------------------------------------------------------------------
# HOW TO ADOPT THIS, AND WHY NO HASH IS PRINTED HERE
#
# Do NOT copy this file byte-for-byte into governance/gate-manifests/g2.yaml. It
# declares, about itself, that it has no authority, and a binding manifest
# asserting that would be absurd. Adoption means editing at least the header and
# the status block -- and any edit changes the sha256, which is why printing a
# hash here would be worse than useless: it would either be wrong, or it would
# pin a document that calls itself non-binding. The value exists to prove the
# operator saw the exact bytes, so the implementer computing it in advance is
# the wrong shape regardless.
#
#   1. operator   Read this -- 47 allowed_paths and 11 forbidden_paths as
#                 drafted. Narrowing is always safe; widening is the thing to be
#                 suspicious of. Settle the six questions above.
#   2. operator   Write the result to governance/gate-manifests/g2.yaml as its
#                 own commit on main -- NOT inside a gate PR, which that path's
#                 own forbidden entry would correctly refuse.
#   3. operator   sha256 the committed file (PowerShell:
#                 Get-FileHash -Algorithm SHA256 <path>). The workflow computes
#                 it from the LF bytes the runner checks out, so a hash taken
#                 from a CRLF working copy will not match.
#   4. operator   Set repository variable GATE_MANIFEST_APPROVED_HASH_G2 to that
#                 value. Settings -> Secrets and variables -> Actions ->
#                 Variables.
#   5. anyone     Only then does a G2 PR reach the scope step instead of failing
#                 closed at the hash step.
#
# None of the five steps makes G2 startable. G1's closure, a G2 plan with a GO,
# and PREFLIGHT-01/02/03 are separate and still outstanding.
# ---------------------------------------------------------------------------
