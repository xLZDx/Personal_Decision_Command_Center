# ---------------------------------------------------------------------------
# forbidden_paths
#
# Everything not in allowed_paths is already out of scope and the checker
# reports it as such. These are a different class: each one is an authority
# surface, where touching it from inside a gate would mean the constrained party
# editing the thing that constrains it. They get their own refusal, with their
# own message, and they are checked BEFORE allowed_paths -- so a forbidden entry
# wins over any pattern above that would otherwise cover it.
# ---------------------------------------------------------------------------

forbidden_paths:
  # INV-28, mandatory for every gate. Includes g2.yaml itself -- deliberately,
  # not paradoxically: a gate PR carrying its own authorizing manifest would be
  # validated against a file the same diff had just written, which is NM3 from
  # the v0.2 adversarial review and the entire reason the hash step runs before
  # the scope step. Taken as the whole subtree rather than as *.yaml/*.yml (the
  # narrower form G1 used so it could edit that directory's README): G2 has no
  # business in that directory at all, so the wider refusal costs it nothing.
  - governance/gate-manifests/**

  # The operator's own record of what they approved, mandatory for every gate.
  # An implementer that can write approvals can manufacture the evidence that it
  # was approved.
  - governance/operator-approvals/**

  # THE FROZEN ARCHITECTURE BASELINE, INV-01..INV-31 included. FORBIDDEN, and
  # the reasoning is worth stating for G2 specifically rather than inherited:
  # G2 is the first gate whose code has to LIVE inside INV-27's 10 ms budget and
  # INV-29's terminal-state rule. A gate that finds its own invariant
  # inconvenient must not be able to edit the invariant; TDD_ERRATA.md exists
  # for concrete corrections and is allowed above, and E-001 states the errata
  # never amends an invariant. Changing INV-27 would need an ADR, independent
  # review and operator approval -- three things a path pattern cannot grant.
  # Also matches scripts/verify/check-floor-scope.mjs, which forbids this path
  # even to an ungated PR.
  - docs/architecture/TDD.md

  # THE ENFORCEMENT MECHANISM. FORBIDDEN, decided against the convenience of
  # allowing it: G1 allowed .github/workflows/*.yml because the workflow WAS
  # G1's deliverable; G2's deliverable is a data pipeline, and a PR that edits
  # these files edits the checks that police that same PR (GitHub runs the
  # workflow as it exists in the PR's merge commit). check-floor-scope.mjs
  # refuses this path even for an ungated PR, so forbidding it here keeps the
  # floor and the gate consistent rather than making a gate label the way to
  # acquire authority no ungated PR has. The cost is real and is named in the
  # open questions below: TDD section 61 lists "migration validation" as a CI
  # requirement, and G2 is the gate that first has migrations. The answer
  # proposed here is that migration validation ships as a vitest test under
  # tests/ -- which CI already runs via `npm run test` -- not as a new workflow
  # step. If the operator disagrees, the fix is to widen this manifest before
  # the gate starts, not during it.
  - .github/workflows/**

  # MERGE AUTHORITY. FORBIDDEN. CODEOWNERS decides who must approve a merge, and
  # INV-20 says the implementer cannot approve or merge its own gate. G2 does
  # add directories a reviewer might reasonably want owned (infra/migrations/,
  # services/), and that is exactly why this stays an operator action: a gate
  # that can edit the ownership map can narrow the review it is subject to, and
  # the scope check cannot tell a tightening from a loosening -- it sees a
  # changed path, not a direction. R13 already narrows what this file proves at
  # all, since one GitHub identity cannot mechanically separate implementer from
  # operator.
  - .github/CODEOWNERS

  # THE CHECKS THEMSELVES. FORBIDDEN. check-floor-scope.mjs says in its own
  # header that the floor's rules live here as ordinary code, "changeable through
  # whichever gate's own manifest permits editing scripts/verify/*.mjs" -- so a
  # manifest that allowed this directory would hand G2 the power to rewrite the
  # floor scope, the gate-scope checker, the secret scan, the test-deletion
  # guard and the mutation harness. CODEOWNERS protects /scripts/verify/ for the
  # same reason. G2 needs nothing here: see the .github/workflows/** note above
  # for where migration validation goes instead.
  - scripts/verify/**

  # G1's OWN POLICY TESTS. FORBIDDEN, while tests/policy/** stays allowed above.
  # These three are the evidence that the governance checks actually bite; a
  # gate that could edit them could keep the checks nominally present and
  # quietly stop them failing. G2's policy tests are about provenance and the
  # AI boundary (TDD section 70), which needs no change to any of these files.
  - tests/policy/gate-scope.test.mjs
  - tests/policy/floor-scope.test.mjs
  - tests/policy/codeowners.test.mjs

  # SECRET MATERIAL. G2 is the first gate to hold real credentials -- Cloudflare
  # API tokens for wrangler, D1 and Queue bindings, wrangler's local .dev.vars.
  # .gitignore already covers .env and .env.*, and scripts/verify/check-secrets
  # .mjs scans tracked file CONTENT for token patterns; this is the third layer,
  # refusing the FILE regardless of what is in it and regardless of a .gitignore
  # edit made in the same PR. Quoted because the reader rejects an unquoted
  # value starting with `*` as a YAML alias. `**` as a leading segment matches
  # at any depth, root included.
  - '**/.env'
  - '**/.dev.vars'

