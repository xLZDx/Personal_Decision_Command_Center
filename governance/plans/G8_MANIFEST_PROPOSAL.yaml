#
# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST CANNOT DO, EVEN ONCE ITS HASH IS APPROVED
#
#   1. IT CANNOT PROVE A RESTORE HAPPENED. It can require the evidence file to
#      exist and confine where the code lives; it cannot distinguish a restore
#      report describing a real isolated database from one describing an
#      intention. That distinction is the reviewer's, and it is the single most
#      important judgement in this gate.
#   2. It cannot tell an addition from a rewrite. infra/cloudflare/**,
#      infra/migrations/** and infra/connector-host/** are where that matters:
#      the check sees a changed path, never whether a cron trigger was added or
#      a queue binding G2 delivered was altered.
#   3. It cannot see a COST. Nothing in a path list refuses a billable resource.
#      A wrangler binding to a paid product, an R2 bucket on an account with a
#      card attached, a metrics volume past the Analytics Engine cap — all of
#      them are ordinary edits to allowed paths. HARD_ZERO is enforced by
#      startup/deployment checks (§64) and by review, not here.
#   4. Nothing checks plan_hash, and in this file there is nothing to check.
#      governance.yml verifies only THIS FILE's own sha256 against the
#      operator-held repository variable.
#   5. The `Gate: G8` label that selects this manifest comes from the branch
#      name or the PR body, both written by the implementer (limitation 6 in
#      ../GATE_MANIFEST_INTEGRITY.md).
#   6. The check runs on `pull_request` only. A direct push to main is not
#      examined by it at all.
#   7. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH — measured
#      2026-09-10, classic PAT with `repo`, `workflow`, `admin:org` and
#      `.permissions.admin` true on this repository. The separation is
#      procedural. Detail in ../plans/G1_PREADOPTION_EVIDENCE.md §3.1.
#   8. AND THE ONE THIS FILE ADDS BY EXISTING: an implementer drafted it, before
#      any G8 plan existed. The only thing between that and a self-authorized
#      scope is the operator reading these bytes.
#
# ---------------------------------------------------------------------------
# QUESTIONS ONLY THE OPERATOR CAN SETTLE
#
#   Q1. R2 AND HARD_ZERO. Settle this BEFORE the gate starts, not during it:
#       does enabling R2 on your Cloudflare account require a payment
#       instrument, and what does its free allowance actually cover for nightly
#       D1 exports under the §53 retention of 7 daily / 4 weekly / 3 monthly? If
#       the answer conflicts with ADR-010, the backup destination is an
#       architecture decision (an ADR, which this manifest forbids the gate from
#       writing), not an implementation choice. A plausible alternative —
#       encrypted backups kept on the connector host plus an off-host copy the
#       operator controls — changes §53 and §77 and therefore needs your ruling
#       first.
#
#   Q2. WHERE DOES THE RETENTION RUNNER LIVE? TDD §55 lists services/{api,
#       ingest,processor,resolver,decision,notification,reporting,
#       content-request-broker} and no retention service, while §52 requires
#       idempotent retention jobs producing structured run reports. This
#       proposal puts them in services/reporting/** by elimination. Confirm, or
#       name services/retention/** and add it to allowed_paths at adoption.
#       Same question for the OPS read model behind §48.
#
#   Q3. THE npm audit DEFERRAL. .github/workflows/ci.yml says tightening the
#       dependency audit is "deferred to G8 (see core/RISK_REGISTER.md)" — but
#       core/RISK_REGISTER.md has no such row (its G1-era entries are R11/R12/
#       R13, none of which is the audit). So a deferral was recorded in a
#       comment pointing at a register that never received it, and the work it
#       defers lives at a path this manifest forbids. Either add
#       `.github/workflows/ci.yml` to allowed_paths for this gate specifically,
#       or make the change yourself outside the gate, or record the deferral
#       properly and push it to G9/G10. The implementer recommends the last: a
#       dependency-audit policy is a supply-chain decision, not an
#       observability deliverable.
#
#   Q4. MISSING INSTRUMENTATION IN EARLIER GATES. §76 requires the operator to
#       be able to answer eleven questions from OPS/trace data, and several of
#       them ("Did event X get accepted?", "Why is event X unprocessed?", "Did
#       restricted provenance touch AI?") depend on metrics that must be emitted
#       by services this manifest deliberately excludes. If G8 finds them
#       missing, do you want (a) a finding against the earlier gate and a
#       separate fix, or (b) this manifest widened at adoption to include those
#       service subtrees? (a) keeps the gate boundaries meaningful and will be
#       slower; (b) is faster and lets one pull request touch most of the
#       system. The implementer recommends (a), and recommends deciding it now
#       rather than under deadline.
#
#   Q5. MUTATION COVERAGE. scripts/verify/mutation-check.mjs holds a hardcoded
#       MUTATIONS list, so proving a NEW guard is genuinely tested requires
#       editing it. It is deliberately outside forbidden_paths but also outside
#       allowed_paths, so today it is refused as out-of-scope. Add it if you want
#       this gate to prove its own guards; it is an evidence harness, not a CI
#       gate (ci.yml does not run it), so the risk is weakened evidence rather
#       than weakened enforcement.
#
#   Q6. WHICH IS AUTHORITATIVE, host/backup-agent/ OR scripts/backup/ +
#       scripts/restore/? TDD §55 creates all three and assigns work to none of
#       them specifically. Both are in scope here so the gate is not blocked,
#       but the answer should be recorded in the decision log rather than
#       inferred later from whichever directory ended up with files in it.
#
# ---------------------------------------------------------------------------
# HOW ADOPTION WORKS, AND WHY NO HASH IS PRINTED HERE
#
# Do NOT copy this file byte-for-byte into governance/gate-manifests/g8.yaml:
# the copy would carry `status: NON_BINDING_PROPOSAL / HAS_NO_AUTHORITY`, so the
# binding manifest would assert about itself that it has no authority. Adoption
# means editing at least the header and the status block — and the moment
# anything is edited the sha256 changes, so any hash printed here would be the
# hash of the wrong bytes.
#
#   1. operator   Review and edit this proposal against the G8 plan, once that
#                 plan exists. Settle Q1 first: it can change the design.
#                 Narrowing is always safe; widening is the thing to be
#                 suspicious of.
#   2. operator   Write the result to governance/gate-manifests/g8.yaml, in its
#                 own commit on main, NOT inside the gate PR — that path is
#                 forbidden above, so a gate PR carrying it fails the Governance
#                 check, correctly.
#   3. operator   Compute its sha256 from the committed LF bytes. A hash taken
#                 from a Windows working copy with CRLF endings will NOT match
#                 what the runner computes.
#   4. operator   Set repository variable GATE_MANIFEST_APPROVED_HASH_G8 to that
#                 value.
#   5. anyone     Open the gate PR. The Governance check now reaches the scope
#                 step instead of failing closed at the hash step.
#
# Step 4 is what makes any of this real. Until it is done the Governance check
# fails closed at the hash step, the scope step is never reached, and G8 has no
# enforced scope — which is the correct behaviour.
# ---------------------------------------------------------------------------
