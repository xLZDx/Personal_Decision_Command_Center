# ---------------------------------------------------------------------------
# DELIBERATELY EXCLUDED, and why
#
#   packages/contracts/**    The contracts landed in b784265, which is already
#                            on main and therefore not in this branch's diff.
#                            No remaining G1 action touches them. If closure
#                            turns out to need a contract change, that is a
#                            scope change: it needs a new plan and a new GO, not
#                            a wider manifest. Widening a manifest to fit a diff
#                            is the failure mode this whole mechanism exists to
#                            prevent.
#
#   core/adr/**              The ADRs are adopted. G1 does not amend them.
#
#   docs/product/**,         Not touched by G1 and not required by any remaining
#   docs/runbooks/**         G1 action.
#
#   scripts/probes/**        G0 evidence. G0 is closed.
#
#   .claude/**               Agent configuration, not gate deliverables.
#
#   CONTRIBUTING.md,         Present in the repository, untouched by G1.
#   SECURITY.md,
#   .gitignore,
#   .prettierrc.json,
#   eslint.config.js
#
# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST STILL CANNOT DO, if adopted as written
#
#   1. It cannot tell a tightening of .github/CODEOWNERS from a loosening of
#      it. The scope check sees a changed path, not the direction of the change.
#      Only branch protection requiring code-owner review covers that, and that
#      is R12 -- available now that the repository is public, but not yet
#      applied.
#   2. The `Gate: G1` label that selects this manifest is written in the PR body
#      by the implementer. An implementer who chose a different gate's label
#      would be checked against a different manifest (limitation 6 in
#      ../GATE_MANIFEST_INTEGRITY.md).
#   3. Nothing checks plan_hash, as stated above.
#   4. The check runs on pull_request only. A direct push to main is not
#      examined by it at all; that gap is closed by branch protection, not by
#      this file.
#   5. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH. Measured
#      2026-09-10, after the operator authenticated the GitHub CLI on this
#      machine: the credential available to the implementer's session is a
#      classic PAT with `repo`, `workflow` and `admin:org`, and
#      `.permissions.admin` is true on this repository. It can set
#      GATE_MANIFEST_APPROVED_HASH_G1, adopt a manifest and then set the hash to
#      match it, remove branch protection, and edit the Governance workflow
#      itself. So the separation this whole mechanism describes is PROCEDURAL --
#      it rests on the implementer not doing what it is able to do, not on being
#      unable to. Full measurement, and the three ways to restore the mechanical
#      property, in G1_PREADOPTION_EVIDENCE.md section 3.1. Adopting this
#      manifest does not fix it; that is a credential decision, not a manifest
#      decision, and it is the operator's.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# HOW TO ADOPT THIS, AND WHY THE HASH IS NOT PRINTED HERE
#
# Do NOT copy this file byte-for-byte into governance/gate-manifests/g1.yaml.
# The copy would still carry the header above and `status: NON_BINDING_PROPOSAL
# / HAS_NO_AUTHORITY`, so the binding manifest would be asserting, about itself,
# that it has no authority. Adoption therefore means editing at least the header
# and the status block -- and the moment anything is edited, the sha256 changes.
#
# That is why no "approved hash" appears in this file. Any hash printed here
# would be the hash of the PROPOSAL, and setting it as
# GATE_MANIFEST_APPROVED_HASH_G1 would either be wrong (if the file was edited,
# as it must be) or would pin a manifest that declares itself non-binding. The
# implementer computing the operator's approval hash in advance is also the
# wrong shape: the value exists to prove the operator saw the exact bytes.
#
# The sequence, with each step's owner:
#
#   1. operator   Review and edit this proposal. It is an argument, not a
#                 ruling; narrowing it is always safe, widening it is the thing
#                 to be suspicious of.
#   2. operator   Write the result to governance/gate-manifests/g1.yaml, with
#                 the header and status block replaced by adoption markers.
#                 This must be its own commit on main, NOT part of the gate PR:
#                 that path is in forbidden_paths above, so a gate PR carrying
#                 it fails the Governance check -- correctly.
#   3. operator   sha256sum governance/gate-manifests/g1.yaml
#                 (PowerShell: Get-FileHash -Algorithm SHA256 <path>)
#   4. operator   Set that value as the repository variable
#                 GATE_MANIFEST_APPROVED_HASH_G1. The design intent is that it
#                 lives outside the implementer's reach, because a variable an
#                 implementer could set would authorize its own manifest.
#                 THAT INTENT IS NOT CURRENTLY MET -- see limitation 5 below.
#                 This step is the operator's by authority, not by capability.
#   5. anyone     Re-open the gate PR. The Governance check now reaches the
#                 scope step instead of stopping at the hash step.
#
# Step 4 is what makes any of this real. Until it is done, the Governance check
# fails at the hash step and G1 has no enforced scope at all -- which is the
# expected, correct result, and is the negative-control evidence step 3 of the
# remediation plan exists to record.
# ---------------------------------------------------------------------------
