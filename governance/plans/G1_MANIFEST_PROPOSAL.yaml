# ---------------------------------------------------------------------------
# forbidden_paths
#
# These are not merely "out of scope" -- everything not in allowed_paths is
# already out of scope and the checker reports it as such. These four are a
# different class: touching one would be the implementer granting itself
# authority, so they get their own refusal with its own message.
# ---------------------------------------------------------------------------

forbidden_paths:
  # INV-28. The binding manifest is the operator's document. An implementer
  # branch that could write it would be validating its own diff against a file
  # that same diff had just rewritten -- NM3 from the v0.2 adversarial review,
  # and the reason the hash check runs before the scope check at all.
  # Both extensions, at any depth: `**` here is a middle segment, so this
  # matches governance/gate-manifests/g1.yaml and any nested variant.
  - governance/gate-manifests/**/*.yaml
  - governance/gate-manifests/**/*.yml

  # The operator's own record of what they approved. An implementer that can
  # write approvals can manufacture the evidence that it was approved.
  - governance/operator-approvals/**

  # The frozen architecture baseline, INV-01..INV-31 included. TDD_ERRATA.md
  # exists precisely so that concrete details can be corrected without amending
  # this file, and E-001 states that the errata never amends an invariant.
  - docs/architecture/TDD.md

# ---------------------------------------------------------------------------
# The fields below are part of the manifest shape described in
# ../gate-manifests/README.md. State them honestly: the checker reads
# allowed_paths and forbidden_paths and NOTHING ELSE. These four are
# documentation for a human reviewer today, not enforcement.
# ---------------------------------------------------------------------------

