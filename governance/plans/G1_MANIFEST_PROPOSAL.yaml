# ---------------------------------------------------------------------------
# allowed_paths
#
# WHAT THIS LIST IS SCOPED TO: the permissible MERGE SCOPE of the G1 pull
# request, not "the work still to be done". The check runs
# `git diff BASE_SHA...HEAD_SHA` and evaluates the CUMULATIVE range from the
# main base to the PR head -- so a manifest listing only future actions would
# fail the scope check on paths this branch already carries, the moment it was
# adopted. This is not retroactive authorization of the branch's individual
# mutations: those were authorized, or not, when they happened, and
# ../../core/DECISION_LOG.md records which. A manifest authorizes what may
# legitimately arrive on main through this gate's PR.
#
# Derived from three sources, as directed: the existing G1 remediation plan,
# the G1 findings and their DoD, and the actual current state of
# gate/g1-remediation. Every entry is justified in the comment above it and
# tagged with which half of the merge scope it comes from:
#
#   [CUMULATIVE]  already in the branch's diff against main, because an
#                 approved G1 remediation finding required it
#   [REMAINING]   not in the diff yet; a named remaining G1 closure action
#                 needs it
#   [BOTH]        already present AND needed again before closure
#
# An entry needed only by a future gate is not here; see "deliberately
# excluded" at the bottom.
#
# Grammar is the segment-bounded one scripts/verify/check-gate-scope.mjs
# enforces, NOT shell globbing: `*` matches within one path segment and never
# crosses `/`, `**` is a whole segment. There is no bare `**` anywhere in this
# file -- a manifest containing one cannot refuse anything, and the checker
# warns about it on every run for exactly that reason.
# ---------------------------------------------------------------------------

allowed_paths:
  # [BOTH] G1-M2/G1-M3. The entries for /scripts/verify/ and /docs/architecture/
  # were added on this branch. Still remaining: this file's own header currently
  # asserts that it "is the control that actually enforces" the separation
  # invariant, which R13 narrows -- with one GitHub account, CODEOWNERS cannot
  # mechanically prove operator-vs-implementer identity separation.
  - .github/CODEOWNERS

  # [BOTH] G1-M2 itself: policy-integrity.yml and gate-scope.yml were replaced by
  # the single governance.yml. All three paths are in this branch's diff, two of
  # them as deletions. ci.yml is covered by the same segment-bounded pattern
  # because the PR will be the first time CI on this repository ever executes a
  # step (R11), and a workflow that has never run once is likely to need a
  # correction when it does. `*` does not cross `/`, so this reaches the workflow
  # files and nothing below them.
  - .github/workflows/*.yml

  # [CUMULATIVE] Reports are conformed by a tool that injects a provenance block
  # by matching its own markup, and prettier was rewriting it. Landed with the
  # G1-M2 commit.
