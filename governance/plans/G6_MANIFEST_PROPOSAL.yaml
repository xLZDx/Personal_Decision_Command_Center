# NON-BINDING IMPLEMENTER PROPOSAL.
# This file does not authorize any mutation.
# Only an operator-authored or operator-adopted copy at
# governance/gate-manifests/g6.yaml plus the
# operator-controlled approved hash has authority.
#
# READ "operator-controlled" AS GOVERNANCE AUTHORITY, NOT AS TECHNICAL
# EXCLUSIVITY. The authenticated implementation session on this machine holds a
# classic PAT with `repo`, `workflow` and `admin:org` and `.permissions.admin`
# true on this repository (measured 2026-09-10, recorded in
# governance/plans/G1_PREADOPTION_EVIDENCE.md section 3.1). It is therefore
# CAPABLE of setting GATE_MANIFEST_APPROVED_HASH_G6 itself. The separation is
# procedural until that credential model changes.
#
#   operator-authorized  !=  technically operator-exclusive
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE IS, AND WHERE IT LIVES
#
# It is a draft for the operator to read, reject, edit or adopt, written at the
# operator's request. It is deliberately NOT in governance/gate-manifests/:
# INV-28 makes that directory operator-owned, and the directory is additionally
# forbidden to every pull request -- by every adopted gate manifest and by
# scripts/verify/check-floor-scope.mjs for ungated ones -- so a file placed
# there by an implementer branch could not legally reach `main` anyway.
#
# The name is G6_MANIFEST_PROPOSAL.yaml rather than g6.yaml so that a draft can
# never be mistaken for the authoritative manifest at a glance in a listing.
#
# Nothing here has been approved. The scope below is an argument, not a ruling.
# ---------------------------------------------------------------------------
# WHAT G6 IS
#
# G6 is Intent + Decisions + Commitments + Minimal Milestones + Priority
# (TDD §23, §26, §27, §28, §30): the operational state that sits on top of the
# Topic G5 produced, and the deterministic priority ordering that answers the
# product's one question -- "What needs my attention now?" (core/PRODUCT_VISION.md).
#
# G6 IS DOWNSTREAM OF THE AGGREGATE, WHICH IS WHY IT INHERITS G5'S BARRIER.
# G5 is where a Gmail event and a Telegram event become one Topic. G6 is where
# that Topic becomes a Decision with options, an owner, a due date, a priority
# and a recommendation -- and the temptation at this gate is specific and
# nameable: ASK A MODEL TO SUMMARIZE, RECOMMEND, EXPLAIN OR FORECAST OVER
# SOMETHING THAT SPANS BOTH SOURCES. Every one of those is forbidden in MVP1,
# and the TDD says so in G6's own sections rather than only in the invariants:
#
#   §26  "an AI-authored recommendation, if enabled at all, is created only
#         inside the Gmail source-local enrichment step and therefore may use
#         Gmail evidence only ... MUST NOT be recomputed, expanded or justified
#         using the combined Gmail+Telegram Topic."
#   §24.2 lists as explicitly POST-MVP: AI summary of a Gmail+Telegram Topic;
#         AI recommendation using combined cross-channel evidence; AI prompt
#         selected or expanded based on Telegram membership; AI rewriting of a
#         Telegram-derived topic title.
#   §28  "No sophisticated AI forecasting in MVP1 ... Progress is based on
#         explicit task/milestone state, not invented LLM percentages."
#   §30  "Final priority is deterministic and explainable."
#
# So G6 may DISPLAY a decision supported by evidence from both sources, and may
# STORE a Gmail-only recommendation produced upstream -- but it may not compute
# one. INV-26 is not a constraint G6 happens to bump into; it is G6's shape.
#
# THE MANIFEST MAKES THAT STRUCTURAL THE SAME WAY G5'S DOES. Every surface on
# which an AI request can be constructed, or on which the fail-closed
# provenance gate that refuses one can be weakened, is in forbidden_paths --
# not merely absent from allowed_paths. A forbidden path produces its own
# refusal naming the pattern; an out-of-scope path produces only "outside G6's
# approved scope". For this gate the difference is the difference between a
# reviewer's judgement call and a mechanical stop.
#
# One sentence, mirroring G5's:
#
#   G6 MAY READ THE COMBINED TOPIC. G6 HAS NO PATH TO ASK A MODEL ABOUT ONE.
#
# See item 1 under "DECISIONS ONLY THE OPERATOR CAN SETTLE" before relying on
# this: there is a live documentary contradiction about whether G6 is an AI
# gate at all, and if it is, this manifest is the wrong shape and must be
# re-cut rather than patched.
# ---------------------------------------------------------------------------

status:
  - NON_BINDING_PROPOSAL
  - IMPLEMENTER_AUTHORED
  - HAS_NO_AUTHORITY
  - NOT_ADOPTABLE_YET_NO_G6_PLAN_EXISTS
  - CONTINGENT_ON_AN_UNRESOLVED_ADR_005_VS_MASTER_PLAN_CONTRADICTION

authored_by: Claude (implementer)
authored_on: 2026-09-11
authored_against_commit: main as of 2026-09-11 (G1 remediated, not yet closed)

gate: G6

# Declared, not created. Naming the branch here is not authorization to create
# it: global CLAUDE.md §14 requires its own double consent for any new branch
# (or, per §20, one genuine GPT-PM VERDICT: APPROVE in place of both).
branch: gate/g6-decision-state

# ---------------------------------------------------------------------------
# PLAN PROVENANCE -- DELIBERATELY UNFILLED, AND THE FILE IS NOT ADOPTABLE UNTIL
# IT IS FILLED.
#
# There is no G6 plan in governance/plans/ yet, and G5 has not been built, let
# alone closed. A manifest is the scope of a PLAN's merge; pinning it before
# the plan exists would be pinning nothing. Two things must be true of these
# fields at adoption time, both learned the hard way on G1:
#
#   1. Pin a COMMIT and a BLOB, never `HEAD:<path>`. G1's first revision said
#      to recompute from HEAD and GPT-PM caught it as a MAJOR: the same path is
#      a different, older object on `main` than on the gate branch, so the
#      recompute would have hashed the wrong file and written false provenance
#      that nothing downstream checks.
#   2. Nothing verifies plan_hash. .github/workflows/governance.yml verifies
#      THIS FILE's own sha256 against the operator-held repository variable and
#      never reads plan_hash (limitation 7 in
#      governance/GATE_MANIFEST_INTEGRITY.md). It is a human-auditable pin, not
#      an enforced one, which is exactly why it must name immutable objects.
plan_id: UNASSIGNED -- no G6 plan exists yet
plan_source_commit: UNASSIGNED
plan_source_blob: UNASSIGNED
plan_hash: UNASSIGNED

approved_scope: >-
  NOT APPROVED. Proposed scope: G6 -- the deterministic intent classifier
  (TDD §23), the Decision model and its state machine (§26), Commitments (§27),
  minimal Milestones with MANUAL/RULE_DERIVED/GMAIL_AI_SUGGESTED forecast
  sources (§28), and the explainable deterministic Priority Engine (§30),
  together with their D1 tables, their evidence links (INV-06: every claim has
  evidence provenance) and the automated proofs that no combined-source
  Decision, Commitment, Milestone or priority explanation is ever computed by,
  or serialized into, an AI request (INV-03/04/05/26, §24.2, §26). Explicitly
  NOT in scope: any AI/inference code, the resolver G5 closed, any connector,
  any shared contract, the proactive/notification engine, and any governance
  or enforcement surface.

# ---------------------------------------------------------------------------
# allowed_paths
#
# WHAT THIS LIST IS SCOPED TO: the permissible MERGE SCOPE of the G6 pull
# request. The check runs `git diff BASE_SHA...HEAD_SHA` over the CUMULATIVE
# range from the `main` base to the PR head, so this must cover everything the
# branch carries at merge time, not only what is left to do.
#
# Derived from: the master plan's G6 line, TDD §23 and §26-§30, the
# Decision/State DoD (§73), and the ACTUAL directory skeleton in this
# repository. Measured 2026-09-11: apps/, services/, infra/, host/ and
# connectors/ contain ZERO tracked files; the only tracked source anywhere is
# packages/contracts/ (7 files). So every entry below names where code WILL
# live, taken from TDD §55's repository tree and §9's component diagram -- not
# from a layout invented for this document.
#
# The derivation worth stating: §9 draws "Operational State -- Intent /
# Decision / Commitment / Milestone / Knowledge Reference" and then "Priority
# Engine" as stages, and §55's tree gives exactly one directory that can hold
# them, `services/decision/`. This manifest follows §55 rather than creating
# services/intent/ or services/priority/. Inventing directories the frozen
# baseline does not name is how a gate's scope quietly stops matching its
# manifest.
#
# Grammar is the segment-bounded one scripts/verify/check-gate-scope.mjs
# enforces, NOT shell globbing: `*` matches within one path segment and never
# crosses `/`, `**` is a whole segment. There is no bare `**` anywhere in this
# file -- a manifest containing one cannot refuse anything, and the checker
# warns about it on every run for exactly that reason.
# ---------------------------------------------------------------------------

allowed_paths:
  # The gate's own code: deterministic intent classification (§23), the
  # Decision model and its OPEN/NEEDS_REVIEW/SNOOZED/RESOLVED/CANCELLED
  # transitions (§26), Commitment states (§27), minimal Milestones and their
  # forecast sources (§28), and the deterministic, explainable Priority Engine
  # (§30). The subtree includes this workspace's own package.json and its
  # colocated tests -- vitest.config.ts already includes
  # `services/**/tests/**/*.test.ts` and tsconfig.json already includes
  # `services/**/*.ts`, which is why neither config file needs to be in scope
  # and both are forbidden below.
  - services/decision/**

  # Canonical domain entities for Decision, Commitment, Milestone, Intent and
  # the priority projection, plus the §8 canonical-state-versus-display split
  # that keeps source-derived text out of shared machine-identity fields --
  # which is also what keeps a "Why priority?" explanation evidence-safe
  # without quoting Telegram text (§30, INV-12).
  #
  # THIS IS THE ALLOWED HALF OF THE ASYMMETRY THE HEADER DESCRIBES. G6 may
  # define a Decision that references evidence from both sources. It cannot
  # define any way to ask a model about one: the only MVP1 AI entry point
  # accepts exactly `GmailEvidenceBundle` and has no overload for Decision or
  # CrossChannelContext (TDD §24.1, ADR-005), and every path on which that
  # entry point or its fail-closed `assert_ai_safe()` could be written or
  # widened is forbidden below.
  - packages/domain/**

  # Forward-only, additive D1 migrations for this gate's own tables and
  # indexes: intents, decisions, decision_evidence, commitments, milestones
  # (TDD §34). Segment-bounded, so it reaches .sql files directly in that
  # directory and nothing nested.
  #
  # TWO CONSTRAINTS THE OPERATOR SHOULD HOLD THIS TO. First, additive only: an
  # edit to an already-applied migration is a rewrite of state that exists on
  # the operator's real D1 database, and nothing in this manifest can tell that
  # apart from a new file. Second, §34's rule that content-bearing fields must
  # use provenance-aware wrappers or normalized provenance tables -- "plain
  # untracked free-text domain columns are forbidden for source-derived
  # values". A decision title or a commitment action text stored as a bare TEXT
  # column is exactly that violation, and it is the likeliest way INV-04 is
  # broken at this gate without anyone calling an AI at all. See also item 3
  # under "DECISIONS ONLY THE OPERATOR CAN SETTLE".
  - infra/migrations/*.sql

  # The proofs, in the test class TDD §70 names ("automated policy/type-boundary
  # tests"). `.ts` only, on purpose: tests/policy/ currently holds the .mjs
  # tests of the governance checks themselves, and those are forbidden below --
  # G6 may add proofs about its own barrier there, never edit the tests that
  # police G6. The two file extensions are already separated by tooling
  # (vitest.config.ts includes both `tests/**/*.test.ts` and
  # `tests/**/*.test.mjs`; `tsc` typechecks only the former), so this split
  # follows an existing boundary rather than inventing one.
  - tests/policy/*.ts

  # The scenario tests §73 requires: commitment state transitions, milestone
  # state transitions, decision resolution audited, "every decision has
  # evidence", "unsupported recommendation rejected", and AI-OFF MODE WORKS --
  # that last one is not a nice-to-have. ADR-010/HARD_ZERO and §25 both require
  # the system to operate with AI disabled entirely, and a G6 that only works
  # when a model is answering has misread the gate.
  - tests/integration/**

  # Fixtures for the above. INV-12 applies with full force: raw message bodies
  # never enter CI fixtures. A fixture here is synthetic, or it is a defect.
  - tests/fixtures/**

  # A MECHANICAL CONSEQUENCE, NOT A LICENCE. Root package.json already declares
  # `workspaces: ["packages/*", "services/*", ...]`, so creating
  # services/decision/ needs no root manifest edit -- but npm records the new
  # workspace in the lockfile regardless of whether it declares a dependency,
  # so the PR cannot avoid touching this file. Root package.json itself is
  # therefore NOT in scope: it is where a new dependency or a new script would
  # be declared, and a deterministic decision/priority engine needs neither.
  #
  # STATED LIMITATION: a lockfile is exactly where a paid or an AI-provider
  # dependency would enter, and the scope check sees a changed path, not the
  # direction or content of the change (the same class of blindness g1.yaml
  # records for CODEOWNERS). The control for that is the §61 dependency scan,
  # ADR-010's HARD_ZERO startup rejection, and a reviewer reading the lockfile
  # diff -- not this line.
  - package-lock.json

  # Durable decisions this gate produces: the priority weights actually shipped
  # (§30's list is explicitly "illustrative configurable weights", so what is
  # chosen is a decision, not a transcription), the intent-class set if it
  # differs from §23's minimum, and the record for anything the operator
  # settles from the list at the bottom.
  - core/DECISION_LOG.md

  # The gate ledger row for G6. Allowed so the gate's own status stays current.
  # Worth a reviewer's eye: a PR can write "CLOSED" in its own row, and that
  # word is not what closes a gate -- GPT-PM's APPROVE and the operator's merge
  # are (INV-20, TDD §58). The row is a record of closure, never its cause.
  - core/PLAN_MASTER_GATES.md

  # R10 (50 D1 queries per Worker invocation) applies again here: a Today view
  # that loads decisions, their evidence and their commitments can reach that
  # ceiling in a way the resolver never did. Any new risk this gate discovers
  # -- for instance a priority explanation that cannot be rendered without
  # source-derived text -- belongs in this register rather than in a comment.
  - core/RISK_REGISTER.md

  # The data model index, which says of itself that it starts carrying real
  # entity-relationship detail once migrations exist. The decision/commitment/
  # milestone entities and their evidence links belong in it.
  - docs/architecture/DATA_MODEL.md

  # The G6 plan itself, named rather than matched by a pattern so that no other
  # gate's plan is in scope. `governance/plans/*.md` would have pulled in
  # G0_PLAN.md, the G1 remediation plan and G5's plan, all of which are either
  # history or another gate's authority.
  - governance/plans/G6_PLAN.md

  # The fresh-context independent review (§67 item 21) lands a new file here.
  # `**` as the last segment covers the subtree and, because the separator is
  # part of the pattern, never the bare directory name.
  - governance/reviews/**

  # The closure report (§67 item 30). Does not exist yet.
  - governance/G6_CLOSURE_REPORT.md

  # The mandated report pair (Russian and English). Segment-bounded, so it
  # reaches reports/ and no subdirectory.
  - reports/*.html

# ---------------------------------------------------------------------------
# forbidden_paths
#
# These are not merely "out of scope" -- everything not in allowed_paths is
# already out of scope and the checker reports it as such. These are a
# different class: each one is a surface on which this gate could either grant
# itself authority, weaken the barrier it exists to respect, or reach back into
# a gate that is already closed. Each gets its own refusal naming the pattern
# that refused it.
#
# The first two are mandatory in every gate manifest in this repository.
# ---------------------------------------------------------------------------

forbidden_paths:
  # INV-28. Gate manifests are operator-owned governance state. A gate PR
  # carrying its own authorizing manifest would validate a diff against a file
  # that same diff had just rewritten -- NM3 from the v0.2 adversarial review,
  # and the reason the hash check runs BEFORE the scope check at all.
  #
  # Written as the whole subtree, which is stricter than g1.yaml's
  # `**/*.yaml` + `**/*.yml` pair. That pair existed because G1 legitimately
  # rewrote governance/gate-manifests/README.md, the documentation of the
  # format it was building. G6 has no such claim on any file in that directory,
  # and this form also matches what check-floor-scope.mjs forbids an UNGATED PR.
  - governance/gate-manifests/**

  # The operator's own record of what they approved. An implementer that can
  # write approvals can manufacture the evidence that it was approved.
  - governance/operator-approvals/**

  # The frozen architecture baseline, INV-01..INV-31 included. G6's own
  # sections (§26, §28, §30) carry the rules this gate is most likely to find
  # inconvenient; the gate bound by them must not be able to edit them.
  - docs/architecture/TDD.md

  # THE ERRATA FILE IS AN AUTHORITY SURFACE, and this is the entry most likely
  # to be argued with, so the reasoning is spelled out. TDD_ERRATA.md says of
  # itself: "Where this file and TDD.md disagree, this file wins." It is
  # therefore the one document that can change what the frozen baseline MEANS.
  # Its own rules say it may not amend an invariant and that an entry needs a
  # quoted GPT-PM ruling -- but those rules are prose inside the file being
  # edited, which is not a control. "Prefer forbidding an authority surface
  # over allowing it for convenience" points one way only, and it points
  # harder here: §26's "MUST NOT be recomputed, expanded or justified using the
  # combined Gmail+Telegram Topic" is exactly the sentence a stuck gate would
  # be tempted to clarify.
  #
  # THIS IS NOT A DEAD END, which is why forbidding it is fair rather than
  # merely strict: check-floor-scope.mjs does NOT forbid this path, so a
  # genuine erratum lands through its own "Gate: NONE" pull request, carrying
  # the required GPT-PM quotation, reviewed on its own terms instead of riding
  # in on a large feature diff.
  - docs/architecture/TDD_ERRATA.md

  # The normative description of the provenance/taint model G6 must obey. A
  # gate that could edit the definition of the barrier could redefine its own
  # compliance without changing a line of code.
  - docs/architecture/PROVENANCE_MODEL.md

  # THE ENFORCEMENT MECHANISM THAT POLICES THIS VERY PULL REQUEST. governance.yml
  # resolves the gate, verifies the manifest hash and runs the scope check;
  # CODEOWNERS is what makes merge authority reviewable at all.
  #
  # G1's own manifest ALLOWED `.github/workflows/*.yml` and `.github/CODEOWNERS`,
  # and that was correct for G1: building that mechanism WAS G1's deliverable.
  # Carrying it forward into a feature gate would invert the design, because
  # check-floor-scope.mjs forbids both paths to an UNGATED PR -- so allowing
  # them here would make a gate-labeled pull request strictly more powerful
  # than one that declares no gate at all. A gate label is a narrowing device.
  # It must never be a way to acquire authority.
  - .github/workflows/**
  - .github/CODEOWNERS

  # The executable governance checks themselves, including the gate-scope
  # checker that evaluates this PR and the test-deletion guard. Same reasoning
  # as the workflow: the policed does not edit the police.
  - scripts/verify/**

  # The tests of those checks. Forbidding the scripts while leaving their tests
  # editable would leave the guards intact and their proof removable, which is
  # the shape of "a broken instrument imitates the result you wanted". The
  # `.ts` policy tests G6 legitimately adds are allowed above; these `.mjs`
  # ones belong to the governance mechanism.
  - tests/policy/*.mjs

  # THE TYPE-LEVEL HALF OF THE AI BARRIER. ADR-005 does not ask for the
  # rejection of a shared-state object to be a runtime policy check; it asks
  # for the TYPE SYSTEM to refuse it ("not just policy-blocked -- the type
  # system itself must reject it"). That property is only as strong as these
  # two files: tsconfig.json carries `strict`, `noUncheckedIndexedAccess` and
  # `exactOptionalPropertyTypes`, and eslint.config.js makes
  # `@typescript-eslint/no-explicit-any` an ERROR with the comment "The
  # AI/provenance boundary is enforced by types (ADR-005). `any` erases exactly
  # the distinctions that enforcement rests on" -- plus `no-console: error`,
  # which is INV-12's practical enforcement and directly relevant to a priority
  # engine that logs why it ranked something. Neither file needs to change for
  # G6: tsconfig already includes `services/**/*.ts`, `packages/**/*.ts` and
  # `tests/**/*.ts`.
  - tsconfig.json
  - eslint.config.js

  # The ability to decide which tests RUN. vitest.config.ts already includes
  # `services/**/tests/**/*.test.ts`, `tests/**/*.test.ts` and
  # `tests/**/*.test.mjs`, and sets `passWithNoTests: false` with a comment
  # naming this exact failure mode. G6 needs no change here, and a gate that
  # could edit its own include list could stop its own proofs from running
  # without deleting a single test.
  - vitest.config.ts

  # THE SHARED CONTRACT, AND THE REASONING IS TWO-PART.
  #
  # Blast radius: packages/contracts is the connector-neutral envelope every
  # other gate consumes -- NormalizedEvent (G2/G3/G4), QueuePayload (G2),
  # PushPayload (G7). Changing it from inside a feature gate alters behavior
  # those gates already verified, under a review scoped to decisions and
  # priority, and it is the classic way a gate quietly widens its own blast
  # radius. The pull is stronger here than at G5 and should be named: a
  # Decision shape that the PWA will read looks like a contract, and G7 has not
  # been built yet to argue about it. It is still not this gate's to declare.
  #
  # And, specific to the barrier: packages/contracts/src/provenance.ts defines
  # `AI_POLICIES`, `AiPolicySchema` and `ProvenanceValue` -- the wrapper the
  # entire INV-04 taint model is expressed in, and the thing a Decision's
  # fields must be wrapped in. A gate that could relax the AI policy enum could
  # make a combined-source decision field look AI-safe by editing one union
  # type.
  #
  # The honest counterpoint, recorded rather than hidden: G6 may well discover
  # it needs a field the contract does not have. The route is a contract change
  # with its own plan and its own GO, not a widened G6 manifest. Rule of thumb
  # for telling the cases apart: a type only the decision service reads is not
  # a contract, and belongs in packages/domain/ or services/decision/.
  - packages/contracts/**

  # THE AI GATE ITSELF. ADR-005 assigns the provenance DAG and the fail-closed
  # composition rule `ai_safe(value) = all provenance ancestors are AI_ALLOW`
  # to these two packages, "as testable primitives, not documentation". They are
  # what refuses a Telegram-tainted value, and they are G2's deliverable, not
  # G6's. G6 must PASS this gate; G6 must never be able to MOVE it. Note the
  # composition rule is where a decision assembled from mixed ancestry is
  # supposed to come out AI_DENY -- which is the single check standing between
  # §26's rule and a plausible-looking "explain this decision" feature.
  - packages/policy/**
  - packages/provenance/**

  # Where the Gmail AI extraction and `GmailEvidenceBundle` construction live
  # (master plan G3; TDD §12, §24.1), and where the Telegram deterministic
  # parser lives (§11.1, G4). Two independent reasons to forbid the subtree:
  # it is the most likely home of the only code in MVP1 that may legally call
  # AI -- including the Gmail-only recommendation §26 says G6 may store but not
  # recompute -- and INV-23 says connector protocol details do not leak into
  # core domain services.
  - connectors/**

  # The queue consumer (G2). Named explicitly rather than left merely
  # out-of-scope because the processing-order rule in §7.1 -- Gmail AI
  # enrichment strictly BEFORE cross-channel resolution -- is enforced on this
  # side of the boundary, and because if the Gmail AI step turns out to live
  # here rather than under connectors/, this entry is what keeps the barrier
  # whole. See limitation 1 at the bottom.
  - services/processor/**

  # G5's RESOLVER, WHICH IS CLOSED BY THE TIME G6 OPENS. This entry has no
  # equivalent in G5's manifest and is the one place the two differ in kind.
  # Global CLAUDE.md §17: "A closed gate is not reopened for an unrelated
  # improvement discovered later." A G6 pull request that edits the resolver is
  # a reopened G5 wearing a G6 label, reviewed by people looking at decisions
  # and priority -- and the resolver is the component carrying the cross-source
  # merge barrier, so it is the worst possible thing to amend under a review
  # aimed elsewhere. If G6 proves the resolver wrong, that is a real finding
  # and it deserves its own plan, its own GO and its own manifest, not a commit
  # inside this one.
  - services/resolver/**

  # The policy documents that define what may be sent to AI at all, and which
  # sources exist. core/SOURCE_POLICY.md carries the verbatim Telegram
  # prohibition and says of itself that changes require ADR + independent
  # review + operator approval; MVP1_SCOPE_LOCK.md is the two-source lock.
  # Neither is editable from inside a gate bound by them.
  - core/SOURCE_POLICY.md
  - core/MVP1_SCOPE_LOCK.md

  # The adopted architecture decisions, ADR-005 (the provenance DAG and the
  # Gmail-only pre-aggregation AI boundary) and ADR-009 (the Gmail-only AI
  # provider decision) above all. §67 item 19 requires an ADR when architecture
  # or policy changes -- and if G6 finds it needs one, that IS the signal that
  # G6's scope was wrong: stop, new plan, new GO. As with the errata file this
  # is not a dead end, because check-floor-scope.mjs leaves core/adr/ reachable
  # by a "Gate: NONE" pull request reviewed on its own merits.
  #
  # A second reason, sharper for this gate than for G5: ADR-005 is also the
  # document whose own verification section says the §70 proofs are owed at
  # "G6 AI integration". If that sentence is stale (item 1 below), correcting
  # it is a governance act with a quoted ruling behind it -- not a line G6
  # edits in passing while it happens to be open.
  - core/adr/**

# ---------------------------------------------------------------------------
# The fields below are part of the manifest shape described in
# governance/gate-manifests/README.md. Stated honestly: the checker reads
# allowed_paths and forbidden_paths and NOTHING ELSE. These three are
# documentation for a human reviewer, not enforcement.
# ---------------------------------------------------------------------------

required_tests:
  - npm run verify
  - npm run verify:mutation
  # §73 Decision/State DoD, every line of it, each an independent assertion:
  # decision schema validated; every decision has evidence; priority
  # explainable; unsupported recommendation rejected; AI-off mode works;
  # Telegram contribution never leaks into AI context; commitment state
  # transitions; basic milestone state transitions; resolution audited.
  - vitest run tests/integration
  # The §70 assertions G6 owes as the gate that turns the aggregate into
  # user-facing state: a Decision/Commitment/Milestone whose ancestry includes
  # Telegram is never serialized into an AI request; a priority explanation
  # carries no source-derived text (§30, INV-12); an AI-authored
  # recommendation is stored with Gmail-only provenance and is provably never
  # RECOMPUTED from the combined Topic (§26). Before citing any of these as
  # evidence, check the assertion would actually fail if the guard were removed
  # -- a test that passes because no code path ever reaches the serializer
  # proves nothing.
