#
#   §31 Proactive Management Engine
#                           Not named in G6's master-plan scope line. It runs
#                           on the structured state G6 creates, so it is
#                           adjacent and will feel in-scope while G6 is open.
#                           It is not. If the operator wants it here, that is a
#                           scope decision with its own GO -- and it changes
#                           this manifest, because the engine's output is a
#                           notification, not a decision.
#
#   knowledge_items,        §29 Knowledge and deliverables is a separate model
#   deliverables            and is absent from G6's scope line. Left out on
#                           purpose rather than by oversight: §29 carries its
#                           own Telegram rule ("Telegram raw text is not
#                           automatically copied into durable Knowledge Items",
#                           "the UI must not silently auto-generate such notes")
#                           which deserves its own gate's attention rather than
#                           a footnote in this one.
#
#   packages/telemetry/**   Observability. G8.
#
#   packages/testkit/**     Fixture builders. tests/fixtures/ and colocated
#                           tests cover G6's needs; a shared testkit is a
