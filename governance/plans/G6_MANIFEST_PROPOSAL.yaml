#                           explainable DATA behind it, not the screen.
#
#   core/DATA_RETENTION_POLICY.md
#                           Retention is source-aware and provenance-aware
#                           (INV-19) and G8's subject.
#
#   governance/plans/G6_MANIFEST_PROPOSAL.yaml
#                           This file. Once the operator has adopted a manifest
#                           from it, editing the proposal inside the very gate
#                           it authorizes would let the record of what was
#                           PROPOSED drift from what was ADOPTED. It is history
#                           the moment the hash is set.
#
#   .claude/**, AGENTS.md,  Agent configuration and repository front matter.
#   CLAUDE.md, README.md    Not G6 deliverables.
#
# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST CANNOT DO, EVEN ONCE ITS HASH IS APPROVED
#
#   1. THE BARRIER IS ONLY AS COMPLETE AS THE PATHS IT NAMES. The forbidden
#      list assumes the AI entry point lives under packages/policy,
#      packages/provenance, connectors/ or services/processor. TDD §55 never
#      states where `AIProvider`/`AIContextBuilder` (§24) actually go. If G3
#      puts them somewhere else -- services/api/, a new packages/ai/ -- a G6 PR
#      could edit them without tripping a single pattern here. RE-CUT THIS LIST
#      ONCE G3 HAS LANDED, before G6 opens.
#
#   2. IT CANNOT SEE SEMANTICS, AND FOR THIS GATE THAT IS THE MAIN GAP. A
#      Decision assembled from Gmail and Telegram evidence, handed to an AI
#      call that lives in an already-allowed file, touches no forbidden path at
#      all. The manifest removes the surfaces where such a call could be BUILT
#      -- no provider, no context builder, no serializer, no way to relax the
#      policy enum -- but it cannot read a line of code. Only
#      `assert_ai_safe()` failing closed, the §70 tests, and AI-01's review
#      cover the remainder. Say so plainly in the closure report; do not let
#      "scope check passed" stand in for "INV-26 was verified".
#
#   3. IT CANNOT TELL DIRECTION. A tightening and a loosening of the same file
#      are the same event to a path check -- the property g1.yaml records for
#      CODEOWNERS, and the reason package-lock.json above is a stated residual
#      risk rather than a solved one.
#
#   4. THE GATE LABEL IS WRITTEN BY THE IMPLEMENTER. The `Gate: G6` line, or a
#      `gate/g6-...` branch name, is what selects THIS manifest. A PR that
#      declared a different gate would be checked against a different manifest
#      (limitation 6 in governance/GATE_MANIFEST_INTEGRITY.md).
#
#   5. NOTHING CHECKS plan_hash, as stated in the provenance block above.
#
#   6. THE CHECK RUNS ON pull_request ONLY. A direct push to `main` is not
#      examined by it. That gap is closed by the `PDCC` ruleset on `main`, not
#      by this file.
#
#   7. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH -- the
#      credential measurement in the header. The separation is procedural.
#
#   8. AND THE ONE THIS FILE ADDS BY EXISTING: an implementer drafted the scope
#      that binds the implementer. The only thing standing between that and a
#      self-authorized scope is the operator actually reading these bytes
#      before setting the hash.
#
# ---------------------------------------------------------------------------
# DECISIONS ONLY THE OPERATOR CAN SETTLE (with GPT-PM as roadmap owner)
#
#   1. IS G6 AN AI GATE? THIS ONE CHANGES THE WHOLE FILE, SO IT IS FIRST.
#      Three documents disagree:
#
#        core/adr/ADR-005-value-provenance-dag.md -- "Verification owed at gate
#          time (G2 primitives, G6 AI integration)".
#        core/RISK_REGISTER.md, row NM2 -- the §70 policy test "must prove this
#          at G2/G6".
#        core/PLAN_MASTER_GATES.md -- G3 is "Gmail connector (... Gmail-
#          EvidenceBundle + source-local AI extraction before merge)", and G6's
#          own scope line is "Intent + Decisions + Commitments + Minimal
#          Milestones + Priority", with no AI in it at all.
#
#      This draft follows the master plan, because project CLAUDE.md §8 puts the
#      repository and the TDD above other records and TDD §24.1 places the AI
#      step firmly before cross-channel resolution -- which is G3's side of the
#      pipeline, not G6's. On that reading the ADR's and the register's "G6"
#      predates the settled gate numbering and both should be corrected.
#
#      BUT IF GPT-PM RULES THE OTHER WAY -- that G6 genuinely owns the AI
#      integration -- THEN THIS MANIFEST IS THE WRONG SHAPE AND MUST BE
#      REDRAWN, not patched: packages/policy, packages/provenance and part of
#      connectors/ would move from forbidden to allowed, the "no path to ask a
#      model" claim in the header would become false, and G6 would need the
#      full §70 test battery as its own DoD rather than the subset listed
#      above. Do not adopt this file until that ruling exists.
#
#   2. DOES G2 DELIVER THE WHOLE §34 SCHEMA? The master plan's G2 line says
#      "D1 schema"; docs/architecture/DATA_MODEL.md says it "gets expanded into
#      real migrations/schema at G2"; TDD §35 says "indexes in migration 001",
#      singular. If all §34 tables land at G2, G6's correct migration count is
#      ZERO and `infra/migrations/*.sql` should be struck from allowed_paths.
#      Identical to G5's item 2 and best answered once, for both.
#
#   3. HOW IS A PROVENANCE-BEARING FIELD ACTUALLY STORED IN D1? §34 forbids
#      "plain untracked free-text domain columns ... for source-derived values"
#      and requires "provenance-aware wrappers or equivalent normalized
#      provenance tables", but the choice between those two is unmade, and
#      §34's table list contains no `provenance_values` table. G6 is the first
#      gate with many content-bearing domain fields (decision question,
#      commitment action, milestone title), so the choice will be made here by
#      default if nobody makes it deliberately -- and under R10's 50-queries-
#      per-invocation ceiling a normalized provenance table has a real read-cost
#      consequence for the Today view. This is a G2 design decision being
#      deferred into G6 by silence.
#
#   4. WHAT DOES "UNSUPPORTED RECOMMENDATION REJECTED" (§73) MEAN MECHANICALLY?
#      It is the one line of G6's DoD with no model behind it in the TDD.
#      Reading it with INV-06 (every claim has evidence provenance) and INV-07
#      (UNKNOWN is preferable to fabricated certainty), the defensible reading
#      is: a recommendation whose evidence set is empty, or whose ancestry is
#      not wholly Gmail-eligible, is refused at write time rather than shown
#      with a caveat. Confirm that reading before it is implemented, because
#      the alternative -- store it and label it -- is a materially different
#      product and a materially different test.
#
#   5. SEQUENCING ODDITY INHERITED FROM G5'S LIST. TDD §71, the QUEUE/
#      RELIABILITY DoD (G2's), contains "MAX_TOPIC_CANDIDATES is bounded and
#      tested", while topic candidate selection is G5's code. Noted here only
#      so the same question is not rediscovered twice.
#
# ---------------------------------------------------------------------------
# HOW TO ADOPT THIS, AND WHY NO HASH IS PRINTED HERE
#
# Do NOT copy this file byte-for-byte into governance/gate-manifests/g6.yaml.
# It carries `status: NON_BINDING_PROPOSAL / HAS_NO_AUTHORITY`, so the copy
# would be a binding manifest asserting about itself that it has none. Adoption
# means editing at least the header, the status block and the plan provenance
# -- and the moment anything is edited, the sha256 changes. Any hash printed
# here would be the hash of the wrong bytes.
#
# The sequence, with each step's owner:
#
#   1. GPT-PM    Rule on item 1 above. It is not a detail: it decides whether
#                this file's central claim is true. Then settle items 2-5, or
#                explicitly defer each with a reason.
#   2. operator  Close G5 first. G6 builds on the Topic the resolver produces,
#                and a manifest for a gate whose foundation is not yet built is
#                a forecast, not a scope.
#   3. operator  Write the G6 plan (governance/plans/G6_PLAN.md), or approve
#                one drafted for review, and give G6 its own GO. A manifest
#                without a plan pins nothing.
#   4. operator  Review and edit this draft. It is an argument, not a ruling.
#                Narrowing is always safe; widening is the thing to be
#                suspicious of.
#   5. operator  Write the result to governance/gate-manifests/g6.yaml with the
#                header, status block and plan provenance replaced by adoption
#                markers, and with plan_source_commit / plan_source_blob /
#                plan_hash pinned to immutable objects. This must be its own
#                commit on `main`, NOT part of the gate PR -- that path is in
#                forbidden_paths above, so a gate PR carrying it fails the
#                Governance check, correctly.
#   6. operator  sha256sum governance/gate-manifests/g6.yaml
#                (PowerShell: Get-FileHash -Algorithm SHA256 <path>)
#                Note the value is computed from the LF bytes the runner checks
#                out; a hash taken from a CRLF working copy will NOT match.
#   7. operator  Set that value as the repository variable
#                GATE_MANIFEST_APPROVED_HASH_G6. Settings -> Secrets and
#                variables -> Actions -> Variables. Setting whatever CI printed
#                without reading the manifest reduces this control to a rubber
#                stamp -- governance.yml says so in its own error text.
#   8. anyone    Open the gate PR. The Governance check now reaches the scope
#                step instead of stopping at the hash step.
#
# Step 7 is what makes any of this real. Until it is done the Governance check
# fails closed at the hash step, the scope step is never reached, and G6 has no
# enforced scope at all -- which is the correct behaviour.
# ---------------------------------------------------------------------------
