#       This is not carelessness, it is structural, and it is worth understanding before adopting
#       ANY manifest: correcting that status line changes the file's bytes, which changes its
#       sha256, which invalidates GATE_MANIFEST_APPROVED_HASH_G1 and fails the gate closed until
#       the operator re-reads and re-sets it. An adopted manifest cannot describe its own adoption.
#       CONSEQUENCE FOR THIS PROPOSAL, applied above: the `status:` and `approved_scope:` fields are
#       written so that they stay true after adoption -- approved_scope describes what the scope IS
#       and what its authority is contingent on, exactly as g1.yaml's own approved_scope does. The
#       status block is the part that must be rewritten at adoption time, and it must be rewritten
#       to a statement that does not go stale.
