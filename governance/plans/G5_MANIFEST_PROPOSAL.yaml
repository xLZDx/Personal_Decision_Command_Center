# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST CANNOT DO, EVEN ONCE ITS HASH IS APPROVED
#
#   1. THE BARRIER IS ONLY AS COMPLETE AS THE PATHS IT NAMES. The forbidden
#      list assumes the AI entry point lives under packages/policy,
#      packages/provenance, connectors/ or services/processor. TDD §55 never
#      states where `AIProvider`/`AIContextBuilder` (§24) actually go. If G3
#      puts them somewhere else -- services/api/, a new packages/ai/ -- a G5 PR
#      could edit them without tripping a single pattern here. RE-CUT THIS LIST
#      ONCE G3 HAS LANDED, before G5 opens.
#
#   2. IT CANNOT SEE SEMANTICS. It cannot tell a resolver that exports a
#      Gmail-safe projection from one that exports a "hint" carrying combined
#      membership which a later gate then feeds to AI in good faith. Nothing
#      about that PR touches a forbidden path. Only `assert_ai_safe()` failing
#      closed at runtime, plus the §70 tests, plus AI-01's review, covers it.
#      The manifest narrows the blast radius; it does not read intent.
#
#   3. IT CANNOT TELL DIRECTION. A tightening and a loosening of the same file
#      are the same event to a path check -- the property g1.yaml records for
#      CODEOWNERS, and the reason package-lock.json above is a stated residual
#      risk rather than a solved one.
#
#   4. THE GATE LABEL IS WRITTEN BY THE IMPLEMENTER. The `Gate: G5` line, or a
#      `gate/g5-...` branch name, is what selects THIS manifest. A PR that
#      declared a different gate would be checked against a different manifest
#      (limitation 6 in governance/GATE_MANIFEST_INTEGRITY.md).
#
#   5. NOTHING CHECKS plan_hash, as stated in the provenance block above.
#
#   6. THE CHECK RUNS ON pull_request ONLY. A direct push to `main` is not
#      examined by it. That gap is closed by the `PDCC` ruleset on `main`, not
#      by this file.
#
#   7. THE APPROVAL HASH IS NOT OUT OF THE IMPLEMENTER'S REACH -- the
#      credential measurement in the header. The separation is procedural.
#
#   8. AND THE ONE THIS FILE ADDS BY EXISTING: an implementer drafted the scope
#      that binds the implementer. The only thing standing between that and a
#      self-authorized scope is the operator actually reading these bytes
#      before setting the hash.
#
# ---------------------------------------------------------------------------
# DECISIONS ONLY THE OPERATOR CAN SETTLE (with GPT-PM as roadmap owner)
#
#   1. WHERE DOES THE AI ENTRY POINT LIVE? The barrier above is path-based and
#      TDD §55 does not place `AIProvider`/`AIContextBuilder`. Settle this at
#      G3 and re-cut forbidden_paths before G5 opens. Until then, treat the
#      barrier as strong-but-conditional, not proven.
#
#   2. DOES G2 DELIVER THE WHOLE §34 SCHEMA? The master plan's G2 line says
#      "D1 schema"; docs/architecture/DATA_MODEL.md says it "gets expanded into
#      real migrations/schema at G2"; TDD §35 says "indexes in migration 001",
#      singular. If all §34 tables land at G2, G5's correct migration count is
#      ZERO and `infra/migrations/*.sql` should be struck from allowed_paths.
#      If G2 ships only the ingest side, G5 owns the resolver tables and the
#      entry stays. This cannot be inferred from the documents as they stand.
#
#   3. WHO EXPOSES THE FALSE-MERGE METRIC? §72 requires it inside G5's DoD;
#      packages/telemetry and the observability surface are G8's. As proposed,
#      G5 cannot satisfy that DoD line. Either add packages/telemetry/** to
#      allowed_paths (narrowly: G5 may add a metric definition, never
#      restructure telemetry), or record that the metric is derived at G8 from
#      the topic_merge_events audit rows G5 does write -- which is the cheaper
#      answer and the one this draft leans toward.
#
#   4. A CONTRADICTION FOUND WHILE READING, WHICH G6 INHERITS MORE THAN G5.
#      ADR-005's verification section says the §70 proofs are owed at
#      "G2 primitives, G6 AI integration", and core/RISK_REGISTER.md's NM2 row
#      says "at G2/G6". But core/PLAN_MASTER_GATES.md puts "GmailEvidenceBundle
#      + source-local AI extraction before merge" in G3, and G6's own scope line
#      contains no AI at all. Either the ADR and the risk register are stale
#      (written before the gate numbering settled) or G6 really is expected to
#      carry the AI integration. That changes which gate must own the §70 tests
#      and, for G5, which gate this manifest is holding the line against.
#      Flagged, not resolved -- it is a roadmap ruling, not an implementer's.
#
#   5. SEQUENCING ODDITY, SMALLER BUT REAL. TDD §71, the QUEUE/RELIABILITY DoD
#      (G2's), contains "MAX_TOPIC_CANDIDATES is bounded and tested". Topic
#      candidate selection is G5's code. As written, a G2 DoD line can only be
#      closed by code G5 has not written yet, or by a G2 stub that G5 then
#      replaces. Worth deciding before G2 closes, not after.
#
# ---------------------------------------------------------------------------
# HOW TO ADOPT THIS, AND WHY NO HASH IS PRINTED HERE
#
# Do NOT copy this file byte-for-byte into governance/gate-manifests/g5.yaml.
# It carries `status: NON_BINDING_PROPOSAL / HAS_NO_AUTHORITY`, so the copy
# would be a binding manifest asserting about itself that it has none. Adoption
# means editing at least the header, the status block and the plan provenance
# -- and the moment anything is edited, the sha256 changes. Any hash printed
# here would be the hash of the wrong bytes.
#
# The sequence, with each step's owner:
#
#   1. GPT-PM    Settle items 1-5 above, or explicitly defer each one with a
#                reason. Item 2 changes this file's allowed_paths; item 4
#                changes which gate owns the §70 proofs.
#   2. operator  Write the G5 plan (governance/plans/G5_PLAN.md), or approve
#                one drafted for review, and give G5 its own GO. A manifest
#                without a plan pins nothing.
#   3. operator  Review and edit this draft. It is an argument, not a ruling.
#                Narrowing is always safe; widening is the thing to be
#                suspicious of.
#   4. operator  Write the result to governance/gate-manifests/g5.yaml with the
#                header, status block and plan provenance replaced by adoption
#                markers, and with plan_source_commit / plan_source_blob /
#                plan_hash pinned to immutable objects. This must be its own
#                commit on `main`, NOT part of the gate PR -- that path is in
#                forbidden_paths above, so a gate PR carrying it fails the
#                Governance check, correctly.
#   5. operator  sha256sum governance/gate-manifests/g5.yaml
#                (PowerShell: Get-FileHash -Algorithm SHA256 <path>)
#                Note the value is computed from the LF bytes the runner checks
#                out; a hash taken from a CRLF working copy will NOT match.
#   6. operator  Set that value as the repository variable
#                GATE_MANIFEST_APPROVED_HASH_G5. Settings -> Secrets and
#                variables -> Actions -> Variables. Setting whatever CI printed
#                without reading the manifest reduces this control to a rubber
#                stamp -- governance.yml says so in its own error text.
#   7. anyone    Open the gate PR. The Governance check now reaches the scope
#                step instead of stopping at the hash step.
#
# Step 6 is what makes any of this real. Until it is done the Governance check
# fails closed at the hash step, the scope step is never reached, and G5 has no
# enforced scope at all -- which is the correct behaviour.
# ---------------------------------------------------------------------------
